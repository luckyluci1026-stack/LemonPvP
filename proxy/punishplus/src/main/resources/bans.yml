# ----------------------------------------------------------
# Vorgefertigte Gruende fuer /offend und /punish.
#
# dauer gilt NUR fuer /offend - /punish ist immer dauerhaft, egal was
# hier fuer eine Dauer eingetragen ist. Schreibweise wie ueberall in der
# Suite: 30m 12h 7d 2w, oder perm/0 fuer permanent.
#
# Eigene Gruende hinzufuegen oder anpassen, danach /punishplus reload.
# ----------------------------------------------------------
gruende:
  CHEATEN:
    text: "Cheaten / Hacks"
    dauer: "30d"
  GRIEFING:
    text: "Griefing"
    dauer: "7d"
  BELEIDIGUNG:
    text: "Beleidigung / Toxic Chat"
    dauer: "1d"
  WERBUNG:
    text: "Werbung / Spam"
    dauer: "3d"
  SCHWERWIEGEND:
    text: "Schwerwiegender Verstoß"
    dauer: "14d"
