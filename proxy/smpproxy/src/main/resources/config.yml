# ==========================================================
#  SMPProxy - Velocity-Plugin
#
#  Domain -> Server:  smp1.lemon-servers.de landet direkt auf smp1,
#                     smp2.lemon-servers.de direkt auf smp2.
#  Fällt ein SMP aus, kommen die Spieler in den Warteraum (NanoLimbo)
#  und werden automatisch zurückgeholt, sobald der Server wieder läuft.
#
#  Die Servernamen hier müssen exakt so heißen wie in der
#  velocity.toml unter [servers].
# ==========================================================

# ----------------------------------------------------------
#  Domain -> Server
#  Groß-/Kleinschreibung egal, ein Punkt am Ende wird ignoriert.
#  Ein * am Anfang gilt für alle Subdomains, z.B. "*.lemon-servers.de".
#  Ein genauer Treffer geht immer vor einem Stern-Eintrag.
# ----------------------------------------------------------
#  Beispiel:
#    "smp1.lemon-servers.de": smp1
#    "smp2.lemon-servers.de": smp2
# ----------------------------------------------------------
domains:

# Wohin geht es, wenn die Domain oben nicht vorkommt?
default-server: SMP

# Der Warteraum (NanoLimbo) - nur fuer Abstuerze, niemand geht da freiwillig
# hin. Leer lassen = wer keinen Server mehr hat, wird getrennt.
limbo: Limbo

# Wohin /hub und /lobby wirklich bringen: der SMPLobby-Server (siehe
# bettersmp-suite/smplobby) mit Spawn, Serverauswahl und allem drumherum.
# Muss in der velocity.toml unter [servers] genauso heissen.
#
# Leer lassen faellt auf den Warteraum von oben zurueck - das alte
# Verhalten, falls (noch) kein eigener Lobby-Server steht.
hub-server: Lobby

# ----------------------------------------------------------
#  Server-Überwachung
#  Daraus ergibt sich alles Weitere: wohin ein Spieler kommt,
#  ob ein Rauswurf ein Absturz oder ein echter Kick war und
#  wann jemand aus dem Warteraum zurück darf.
# ----------------------------------------------------------
monitor:
  # Alle wie viel Sekunden wird jeder Server angepingt?
  interval: 5
  # Wie lange darf ein Ping dauern, bevor der Server als offline gilt?
  timeout: 3
  # Direkt beim Start einmal prüfen, statt erst nach dem Intervall
  check-on-start: true

# ----------------------------------------------------------
#  Automatisch zurück aus dem Warteraum
# ----------------------------------------------------------
auto-return:
  enabled: true
  # So viele erfolgreiche Pings hintereinander, bevor zurückgeschickt wird.
  # Verhindert, dass Spieler in einen gerade erst startenden Server laufen.
  confirmations: 3
  # Sekunden Wartezeit zwischen zwei Rückhol-Versuchen pro Spieler
  cooldown: 5
  # Hinweise im Chat anzeigen
  show-notice: true
  # Auf diese Server wird nie zurueckgeholt - stuerzt z.B. der Duels-
  # Server mitten im Duell ab, geht es sofort dorthin zurueck, wo man
  # vorher war (ohne Umweg ueber den Warteraum).
  skip-servers: ["Duels"]

# ----------------------------------------------------------
#  Befehle
# ----------------------------------------------------------
commands:
  # /hub bzw. /lobby schickt zur Lobby (hub-server oben). "limbo" ist
  # absichtlich kein Alias mehr: den Warteraum betritt niemand freiwillig,
  # man landet nur automatisch dort, wenn ein Server abstuerzt.
  hub-enabled: true
  hub-aliases: ["spawn", "lobby"]
  # /smp1, /smp2 ... als Kurzbefehle für /server <name>
  server-shortcuts: true

# ----------------------------------------------------------
#  Im Kampf gesperrt
#
#  BetterSMP meldet dem Proxy, wer gerade im Kampf ist, DuelPlus
#  meldet, wer gerade ein Duell spielt. Solange sind /server, alle
#  Namen von /hub (hub-aliases oben) und die Kurzbefehle /smp1,
#  /smp2 ... gesperrt - sonst koennte man sich per /spawn oder
#  /lobby aus dem Kampf retten.
#  Weitere Proxy-Befehle kommen unter blocked-commands dazu.
# ----------------------------------------------------------
combat:
  enabled: true
  blocked-commands: []

# ----------------------------------------------------------
#  Chat zwischen den Servern
#
#  Was auf einem dieser Server geschrieben wird, sehen auch alle
#  auf den anderen - mit dem Servernamen davor. Auf dem Duels-
#  Server sieht man nur die Nachrichten seines Gegners (DuelPlus).
#  Stummgeschaltete Spieler (/gmute auf dem SMP) werden ueberall
#  geblockt, auch in der Lobby und bei /msg.
# ----------------------------------------------------------
chat-sync:
  enabled: true
  servers: ["SMP", "Lobby"]
  # Steht vor Nachrichten von einem anderen Server. Leer = nichts davor.
  server-tag: "<dark_gray>[<gray>%server%</gray>]</dark_gray>"

# ----------------------------------------------------------
#  Beitreten/Verlassen
#
#  Nur wenn jemand das Netzwerk betritt oder verlaesst - nicht bei
#  jedem Wechsel zwischen SMP, Lobby und Duels. Die Nachricht sehen
#  alle auf den Servern unter chat-sync.servers.
# ----------------------------------------------------------
join-quit:
  enabled: true

# ----------------------------------------------------------
#  /msg und /r ueber alle Server
# ----------------------------------------------------------
msg:
  enabled: true
  aliases: ["msg", "tell", "w", "whisper", "pm", "m"]
  reply-aliases: ["r", "reply"]

# ----------------------------------------------------------
#  /rtp von überall im Netzwerk
#
#  Steht der Spieler schon auf einem Server aus passthrough-servers
#  (BetterRTP ist dort installiert), geht /rtp unverändert dorthin durch
#  - nichts ändert sich für Spieler, die schon auf dem SMP sind.
#
#  Steht er woanders (z.B. in der Lobby), wird er erst auf
#  redirect-server geschickt, und sobald er dort angekommen ist, startet
#  automatisch RTP. Dafür muss BetterRTP auf redirect-server installiert
#  sein und denselben Kanal abhören (siehe dessen eigene config.yml).
# ----------------------------------------------------------
rtp:
  enabled: true
  passthrough-servers: ["SMP"]
  redirect-server: "SMP"

# ----------------------------------------------------------
#  /ah (Auktionshaus) von überall im Netzwerk
#
#  Auf den Servern unter passthrough-servers geht /ah direkt an
#  FastShop. Von allen anderen (z.B. der Lobby) geht es erst auf
#  redirect-server, dort öffnet sich dann sofort das Auktionshaus.
#  Im Duell, im Kampf und eingefroren ist dieser Wechsel gesperrt.
# ----------------------------------------------------------
ah:
  enabled: true
  aliases: ["ah", "auktionshaus", "auktion", "auction", "auctionhouse"]
  passthrough-servers: ["SMP"]
  redirect-server: "SMP"

# ----------------------------------------------------------
#  Release-Countdown
#
#  Bis zum Release warten alle im Warteraum (limbo oben) und sehen
#  einen Live-Countdown: Bossbar, in der letzten Minute die Sekunden
#  in der Actionbar, in den letzten Sekunden grosse Zahlen mit Ton.
#  Zur Release-Zeit geht es in fairen Wellen auf den ziel-server:
#  wer zuerst im Warteraum war, ist zuerst drin. Laeuft der
#  ziel-server noch nicht, wird gewartet, bis er da ist. Danach ist
#  alles wieder ganz normal (auch nach einem Proxy-Neustart).
#
#  zeit: z.B. "2026-10-03 18:00" oder "03.10.2026 18:00"
#        (Zeitzone siehe zeitzone). Leer = kein Release geplant.
#
#  Team mit dem Recht smpproxy.release.bypass darf vorher schon ueberall
#  hin. Befehle:
#    /release                     Countdown fuer alle anzeigen
#    /release zeit <Datum> <Zeit> Termin setzen   (smpproxy.release.admin)
#    /release jetzt [Sekunden]    gleich starten  (smpproxy.release.admin)
#    /release aus                 Countdown beenden (smpproxy.release.admin)
#    /testrelease [Sekunden]      Probe-Release nur fuer dich
#                                 (smpproxy.release.test, stop = abbrechen)
#  Was per /release gesetzt wird, steht in release.yml und gilt vor
#  dem Wert hier.
# ----------------------------------------------------------
release:
  zeit: ""
  zeitzone: "Europe/Berlin"
  ziel-server: "SMP"
  # Bis zum Release gesperrt (der Warteraum ist nie gesperrt)
  gesperrte-server: ["SMP", "Lobby", "Duels"]
  # So viele Spieler je Welle, alle wellen-abstand-sekunden eine Welle -
  # damit der Server nicht von allen gleichzeitig ueberrannt wird.
  pro-welle: 5
  wellen-abstand-sekunden: 2
  # So viele letzte Sekunden mit grosser Zahl und Ton
  finale-sekunden: 10
  # Erinnerung im Chat des Warteraums alle X Minuten (0 = aus)
  erinnerung-minuten: 5

# ----------------------------------------------------------
#  Einlass: nicht alle auf einmal
#
#  Wollen viele Spieler gleichzeitig auf einen dieser Server (Start
#  nach einem Neustart, alle kommen aus dem Warteraum zurueck, alle
#  klicken in der Lobby gleichzeitig auf SMP), kommen sie gestaffelt
#  rein. Wer warten muss, sieht seinen Platz in der Actionbar und wird
#  automatisch verbunden - neue Verbindungen warten dafuer im Limbo.
#
#  Die Server melden dem Proxy ihre Auslastung (Millisekunden pro Tick,
#  50 = voll ausgelastet; BetterSMP und SMPLobby machen das von selbst).
#  Ab "langsamer-ab-mspt" kommt nur noch die Haelfte rein, ab
#  "pause-ab-mspt" niemand, bis es wieder besser ist. Das gilt auch fuer
#  die Wellen beim Release.
# ----------------------------------------------------------
einlass:
  aktiv: true
  server: ["SMP"]
  # So viele Spieler pro Sekunde (Kommazahlen gehen, z.B. 2.5)
  pro-sekunde: 4
  langsamer-ab-mspt: 35
  pause-ab-mspt: 45
  # Wer von diesen Servern kommt, wartet nie (Rueckkehr aus einem Duell)
  ausnahmen-von: ["Duels"]

# ----------------------------------------------------------
#  Bedrock (Geyser auf diesem Proxy)
#
#  Prueft beim Start die Geyser-Config und stellt die Direktverbindung
#  ohne doppelte Kompression ein - ein Bedrock-Spieler kostet dann kaum
#  mehr als ein Java-Spieler. Wirkt nach dem naechsten Proxy-Neustart.
# ----------------------------------------------------------
bedrock:
  geyser-optimieren: true

# ----------------------------------------------------------
#  /regeln und /rules
#
#  Beide Befehle zeigen dasselbe - auf jedem Server im Netzwerk.
#  Das Regelbuch in der Lobby zeigt ebenfalls genau diese Zeilen.
#  Jede Zeile ist eine Chatzeile (MiniMessage), "" = Leerzeile.
# ----------------------------------------------------------
regeln:
  enabled: true
  aliases: ["regeln", "rules"]
  zeilen:
    - "<gradient:#6C5CE7:#00D4FF><bold>BuckSMP · Regeln</bold></gradient>"
    - "<white>1. Respektvoller Umgang</white> <dark_gray>-</dark_gray> <gray>Beleidigungen, Hassrede, Rassismus und Diskriminierung jeder Art sind nicht erlaubt - im Chat, Voice und im WhatsApp Channel.</gray>"
    - "<white>2. Kein Cheaten</white> <dark_gray>-</dark_gray> <gray>Hacks, X-Ray, Autoclicker, Exploits und Bugusing sind verboten. Unser Anti-Cheat läuft mit - Verstöße fliegen auf.</gray>"
    - "<white>3. Kein Griefing & Diebstahl</white> <dark_gray>-</dark_gray> <gray>Fremde Bauten, Farmen und Truhen bleiben unangetastet, außer im ausdrücklich erlaubten PvP-/Duell-Kontext.</gray>"
    - "<white>4. Kein Spam & keine Werbung</white> <dark_gray>-</dark_gray> <gray>Kein Werben für andere Server, keine Dauerwerbung eigener Projekte, kein Chat-Spam oder Caps-Flooding.</gray>"
    - "<white>5. Ein Account pro Spieler</white> <dark_gray>-</dark_gray> <gray>Multi-Accounts zum Umgehen von Strafen oder zum Ausnutzen von Vorteilen sind nicht gestattet.</gray>"
    - "<white>6. Anweisungen vom Team befolgen</white> <dark_gray>-</dark_gray> <gray>Team-Mitglieder moderieren im Sinne der Community - ihren Anweisungen ist Folge zu leisten.</gray>"
    - ""
    - "<gray>Regelverstoß gesehen?</gray> <click:suggest_command:'/report '><hover:show_text:'<gray>Spieler melden'><#00D4FF>/report</#00D4FF></hover></click> <dark_gray>·</dark_gray> <gray>Voice-Chat:</gray> <click:run_command:'/vcrules'><hover:show_text:'<gray>Regeln für den Voice-Chat'><#00D4FF>/vcrules</#00D4FF></hover></click>"
    - "<gray>Alles nachlesen:</gray> <click:open_url:'https://bucksmp.de/regeln/'><hover:show_text:'<gray>Im Browser öffnen'><#00D4FF><underlined>bucksmp.de/regeln</underlined></#00D4FF></hover></click>"

# ----------------------------------------------------------
#  Nachrichten (MiniMessage - Gradients, Farben, alles erlaubt)
# ----------------------------------------------------------
messages:
  prefix: "<gradient:#6C5CE7:#00D4FF><bold>BuckSMP</bold></gradient> <dark_gray>»</dark_gray> "

  # Beim Verbinden ist der Zielserver aus
  server-offline: "%prefix%<red><white>%server%</white> ist gerade nicht erreichbar.</red><newline><gray>Du wartest hier, bis er wieder da ist.</gray>"
  # Der Server ist während des Spielens weggebrochen
  server-crashed: "%prefix%<red>Verbindung zu <white>%server%</white> verloren.</red><newline><gray>Du wurdest in den Warteraum gebracht.</gray>"
  # Absturz eines Servers aus auto-return.skip-servers (z.B. Duels): direkt zurueck
  server-crashed-home: "%prefix%<red>Verbindung zu <white>%server%</white> verloren.</red><newline><gray>Du bist wieder auf <white>%home%</white>.</gray>"
  # Wechsel auf so einen Server klappt nicht - man bleibt, wo man ist
  server-unreachable: "%prefix%<red><white>%server%</white> ist gerade nicht erreichbar.</red>"
  # Zurückholen läuft
  return-soon: "%prefix%<green><white>%server%</white> ist wieder da - du kommst gleich zurück.</green>"
  return-ok: "%prefix%<green>Willkommen zurück auf <white>%server%</white>.</green>"
  return-failed: "%prefix%<gold><white>%server%</white> startet noch. Ich versuche es gleich nochmal.</gold>"

  # Es gibt keinen Warteraum -> Spieler wird getrennt (Trennbildschirm)
  no-limbo: "<gradient:#FF6B6B:#C92A2A><bold>Server nicht erreichbar</bold></gradient><newline><newline><gray>%server% ist gerade offline.</gray><newline><gray>Bitte versuche es in ein paar Minuten nochmal.</gray>"
  limbo-crashed: "<gradient:#FF6B6B:#C92A2A><bold>Verbindung verloren</bold></gradient><newline><newline><gray>Auch der Warteraum ist nicht erreichbar.</gray><newline><gray>Bitte versuche es gleich nochmal.</gray>"

  # /hub
  hub-sending: "%prefix%<gray>Bringe dich zur Lobby ...</gray>"
  hub-already: "%prefix%<gold>Du bist bereits in der Lobby.</gold>"
  hub-missing: "%prefix%<red>Es ist keine Lobby eingerichtet.</red>"

  # /smp1, /smp2 ...
  switch-sending: "%prefix%<gray>Verbinde dich mit <white>%server%</white> ...</gray>"
  switch-already: "%prefix%<gold>Du bist bereits auf <white>%server%</white>.</gold>"
  switch-offline: "%prefix%<red><white>%server%</white> ist gerade offline.</red>"
  switch-failed: "%prefix%<red>Verbindung zu <white>%server%</white> fehlgeschlagen.</red>"

  # Im Kampf gesperrt (siehe combat oben)
  combat-blocked: "%prefix%<red>Dieser Befehl ist im Kampf gesperrt! (<white>%seconds%s</white>)</red>"
  duel-blocked: "%prefix%<red>Das geht erst, wenn das Duell vorbei ist.</red>"
  freeze-blocked: "%prefix%<red>Du bist eingefroren und kannst den Server gerade nicht wechseln.</red>"

  # Beitreten/Verlassen (siehe join-quit oben)
  network-join: "<dark_gray>[<green>+</green>]</dark_gray> <#00D4FF>%player%</#00D4FF> <gray>ist dem Server beigetreten.</gray>"
  network-first-join: "<dark_gray>[<#00D4FF>★</#00D4FF>]</dark_gray> <#00D4FF>%player%</#00D4FF> <gray>ist zum <white>ersten Mal</white> hier! Willkommen!</gray>"
  network-quit: "<dark_gray>[<red>-</red>]</dark_gray> <#00D4FF>%player%</#00D4FF> <gray>hat den Server verlassen.</gray>"

  # /msg und /r
  msg-usage: "%prefix%<gray>/msg <Spieler> <Nachricht></gray>"
  reply-usage: "%prefix%<gray>/r <Nachricht></gray>"
  msg-offline: "%prefix%<red><white>%target%</white> ist gerade nicht online.</red>"
  msg-self: "%prefix%<red>Du kannst dir nicht selbst schreiben.</red>"
  msg-no-reply: "%prefix%<red>Du hast noch keine Nachricht, auf die du antworten kannst.</red>"
  msg-sent: "<dark_gray>[<gray>Du</gray> <dark_gray>→</dark_gray> <#00D4FF>%target%</#00D4FF>]</dark_gray> <white>%message%</white>"
  msg-received: "<hover:show_text:'<gray>Klick zum Antworten'><click:suggest_command:'/msg %sender% '><dark_gray>[<#00D4FF>%sender%</#00D4FF> <dark_gray>→</dark_gray> <gray>Dir</gray>]</dark_gray></click></hover> <white>%message%</white>"
  muted: "%prefix%<red>Du bist stummgeschaltet und kannst gerade nicht schreiben (noch <white>%dauer%</white>).</red>"

  # /smpproxy
  player-only: "%prefix%<red>Das geht nur im Spiel.</red>"
  no-permission: "%prefix%<red>Dazu hast du keine Rechte.</red>"
  reloaded: "%prefix%<green>Konfiguration neu geladen.</green>"
  help: "%prefix%<gray>/smpproxy <white>status</white> <dark_gray>|</dark_gray> <white>reload</white></gray>"
  status-header: "%prefix%<gray>Serverstatus:</gray>"
  status-online: "<dark_gray> ▪ </dark_gray><white>%server%</white> <dark_gray>-</dark_gray> <green>online</green> <dark_gray>(</dark_gray><gray>%spieler% Spieler</gray><dark_gray>)</dark_gray>"
  status-offline: "<dark_gray> ▪ </dark_gray><white>%server%</white> <dark_gray>-</dark_gray> <red>offline</red>"
  unknown-server: "%prefix%<red>Server <white>%server%</white> gibt es nicht.</red>"

  # /netban, /netunban, /netbans, /netbaninfo
  #
  # Netzwerkbann: kickt vom Proxy selbst, nicht von einem Server -
  # betroffen ist damit das GANZE Netzwerk inklusive Lobby. Fuer einen
  # Rauswurf nur von einem einzelnen SMP gibt es weiterhin BetterSMPs
  # eigenes /gban dort.
  ban-permanent-word: "für immer"
  netban-usage: "%prefix%<gray>/netban <white><Spieler></white> [Dauer] [Grund]</gray><newline><gray>Dauer: <white>30m 12h 7d 2w</white> oder <white>perm</white> - weglassen heißt permanent.</gray>"
  netban-default-reason: "Kein Grund angegeben"
  netban-unknown: "%prefix%<red><white>%spieler%</white> ist unbekannt.</red><newline><gray>Der Name muss sich schon einmal mit diesem Netzwerk verbunden haben - oder gib gleich die UUID an.</gray>"
  netban-ok: "%prefix%<green><white>%spieler%</white> ist jetzt gebannt (<white>%dauer%</white>).</green>"
  netunban-usage: "%prefix%<gray>/netunban <Spieler></gray>"
  netunban-ok: "%prefix%<green><white>%spieler%</white> ist entbannt.</green>"
  netunban-not-banned: "%prefix%<gold><white>%spieler%</white> war gar nicht gebannt.</gold>"
  netbans-empty: "%prefix%<gray>Niemand ist gerade gebannt.</gray>"
  netbans-header: "%prefix%<gray><white>%anzahl%</white> Bann(s):</gray>"
  netbans-entry: "<dark_gray> ▪ </dark_gray><white>%spieler%</white> <dark_gray>bis</dark_gray> <gray>%dauer%</gray> <dark_gray>-</dark_gray> <gray>%grund%</gray>"
  netbaninfo-usage: "%prefix%<gray>/netbaninfo <Spieler></gray>"
  netbaninfo-not-banned: "%prefix%<gray><white>%spieler%</white> ist nicht gebannt.</gray>"
  netbaninfo-header: "%prefix%<white>%spieler%</white><newline><gray>Grund: <white>%grund%</white></gray><newline><gray>Von: <white>%von%</white></gray><newline><gray>Bis: <white>%dauer%</white></gray>"

  # /rtp
  rtp-sending: "%prefix%<gray>Bringe dich rüber, dann geht's direkt mit RTP weiter ...</gray>"
  rtp-not-configured: "%prefix%<red>/rtp ist nicht eingerichtet.</red><newline><gray>In config.yml unter <white>rtp.redirect-server</white> einen Server eintragen.</gray>"

  # /ah von einem anderen Server aus (siehe ah oben)
  ah-sending: "%prefix%<gray>Das Auktionshaus ist auf <white>%server%</white> - einen Moment ...</gray>"
  ah-not-configured: "%prefix%<red>/ah ist nicht eingerichtet.</red><newline><gray>In config.yml unter <white>ah.redirect-server</white> einen Server eintragen.</gray>"

  # Der Trennbildschirm beim Bann selbst - kein %prefix%, das HIER ist
  # der ganze Bildschirm.
  ban-screen-perm: "<gradient:#FF6B6B:#C92A2A><bold>Du bist gebannt</bold></gradient><newline><newline><gray>Grund:</gray> <white>%reason%</white><newline><gray>Von:</gray> <white>%by%</white><newline><gray>Dauer:</gray> <white>für immer</white>"
  ban-screen-temp: "<gradient:#FF6B6B:#C92A2A><bold>Du bist gebannt</bold></gradient><newline><newline><gray>Grund:</gray> <white>%reason%</white><newline><gray>Von:</gray> <white>%by%</white><newline><gray>Läuft ab:</gray> <white>%expires%</white><newline><gray>Noch:</gray> <white>%remaining%</white>"
