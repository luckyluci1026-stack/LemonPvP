# Kit definitions per gamemode — competitive full loadouts.
#
# Layout per gamemode:
#   hotbar:    slots 0-8   (the 9 hotbar slots)
#   inventory: slots 9-35  (backup/refill items, players re-sort them freely)
#   armor:     head/chest/legs/feet (locked in the editor, always preset)
#
# Item keys: material, amount, enchantments: {NAME: level}, unbreakable,
#            potion: <PotionType> (for potion/splash/lingering/tipped arrow),
#            name, custom-model-data.
#
# Players rearrange these in the kit editor (sort-only); the preset defines
# WHAT you get, the player defines WHERE it sits.
kits:
  sword:
    hotbar:
      0: {material: DIAMOND_SWORD, amount: 1, enchantments: {SHARPNESS: 5, UNBREAKING: 3, FIRE_ASPECT: 2}}
