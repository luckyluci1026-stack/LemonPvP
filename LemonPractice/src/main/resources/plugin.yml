name: LemonPractice
version: "1.0.0"
main: com.lemonpvp.lemonpractice.LemonPractice
api-version: "1.21"
description: LemonPvP Practice Plugin
authors: [LemonPvP]
softdepend: [LuckPerms, FastAsyncWorldEdit, LemonCore, LemonCosmetics]

permissions:
  lemonpractice.admin.reload:
    description: Reload LemonPractice configs without restarting
    default: op
  lemonpractice.admin.arena:
    description: Manage arenas
    default: op
  lemonpractice.admin.buildspawn:
    description: Build lobby spawn
    default: op
  lemonpractice.admin.elo:
    description: Manage player ELO
    default: op
  lemonpractice.priority.queue:
    description: Priority queue after restart
    default: false
  lemonpractice.use.queue:
    description: Join queues
    default: true
  lemonpractice.use.ffa:
    description: Join FFA arenas
    default: true
  lemonpractice.use.duel:
    description: Challenge players to direct duels
    default: true
  lemonpractice.use.party:
    description: Use the party system
    default: true
  lemonpractice.use.stats:
    description: View player statistics
    default: true

commands:
  lpractice:
    description: LemonPractice admin commands
    permission: lemonpractice.admin.reload
    usage: /lpractice reload
  aowarena:
    description: Manage arenas
    permission: lemonpractice.admin.arena
    usage: /aowarena <create|setspawn1|setspawn2|setspawnspec|setpos1|setpos2|bind|dupe|save|buildarenas> <name> [args]
  aowbuildspawn:
    description: Build the tropical lobby spawn
    permission: lemonpractice.admin.buildspawn
  gelo:
    description: Manage player ELO
    permission: lemonpractice.admin.elo
    usage: /gelo <player> <add|remove|set|reset> <gamemode> [amount]
  duel:
    description: Challenge a player to a direct duel
    permission: lemonpractice.use.duel
    usage: /duel <player> [gamemode] | /duel accept|deny <player>
  stats:
    description: View your or another player's statistics
    permission: lemonpractice.use.stats
    usage: /stats [player]
  party:
    description: Manage your party
    permission: lemonpractice.use.party
    usage: /party <invite|accept|deny|leave|kick|disband|list|promote|queue|chat> [args]
  p:
    description: Party chat shortcut
    permission: lemonpractice.use.party
    usage: /p <message>
  partychat:
    description: Party chat
    permission: lemonpractice.use.party
    usage: /partychat <message>
