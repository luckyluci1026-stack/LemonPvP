# Roaming-zone FFA: a single fixed-size square play area (a per-player
# WorldBorder, "size" blocks across) that does NOT shrink. Every
# relocate-minutes the whole zone jumps to a new random location and everyone is
# scattered into it with the border re-centered. Players respawn inside the zone.
# The world should be provided by Multiverse-Core. Join with /ffa.
ffa:
  arenas-built: false
  world: world_ffa        # world the FFA runs in (loaded by Multiverse-Core)
  size: 150               # border size in blocks (play area is size x size)
  relocate-minutes: 20    # how often the zone jumps to a new location
  center-range: 2000      # max distance from world spawn for a new random center
  kit-gamemode: sword     # kit/gamemode id applied to FFA players (see gamemodes.yml)
  respawn-delay-ticks: 60 # delay before auto-respawn after death (20 = 1s)
  border-warning: 6       # world-border warning distance (blocks)

# Duel replays: compact recordings of duels, each capped at 50 KB and kept for
# 100 days (extend with /replay <name> add <days>). Lower sample-interval-ticks
# = smoother but larger; the 50 KB cap auto-reduces the rate if needed.
replays:
  enabled: true
  sample-interval-ticks: 2
  # Kill-cam: after a duel, auto-show the loser a slow-mo of the last few seconds.
  killcam:
    enabled: true
    seconds: 4
    speed: 0.6

# Ranked / ELO. Disabled = fully casual: duels never change ELO, no rank tiers
# or rank badges are shown. Set to true to enable competitive ranked play.
ranked:
  enabled: false

# Zone Practice — battle-royale style practice in real, random vanilla terrain
# with a shrinking damage zone (DrDonut style).
zone:
  world: world            # vanilla world the rounds run in
  initial-radius: 200     # starting zone radius (blocks); border diameter is 2x this
  min-radius: 10          # smallest the zone shrinks to
  shrink-seconds: 180     # time (s) for the zone to shrink from initial to min
  damage-per-second: 2.0  # damage applied each second to players outside the zone (2 = 1 heart)
  kit-gamemode: sword     # kit/gamemode id applied to participants (see gamemodes.yml)
  min-players: 1          # players required before the shrink/damage starts
  border-warning: 10      # world-border warning distance (blocks) shown to players

duel-arenas:
