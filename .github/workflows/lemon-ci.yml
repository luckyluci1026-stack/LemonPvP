name: Lemon CI

on:
  push:
    paths-ignore:
      - 'index.html'
      - 'index.zip'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lemon-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Platform-neutral runtime (API + core) incl. lifecycle integration tests.
  runtime:
    name: Runtime core (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # Built and uploaded before the tests so the server tests get the agent even if a unit test fails.
      - name: Build live-patch agent
        run: ./gradlew :livepatch-agent:jar --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: livepatch-agent
          path: runtime/livepatch-agent/build/libs/lemon-livepatch-agent.jar
          if-no-files-found: error
      - name: Build and test (unit tests run with -javaagent, like a server)
        run: ./gradlew build --console=plain
      - name: Test summary
        if: always()
        run: python3 ../scripts/ci/junit-summary.py .
      - name: Upload runtime test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-test-reports
          path: runtime/**/build/test-results/test/*.xml
          if-no-files-found: ignore

  # The same unit tests on JetBrains Runtime with enhanced class redefinition, where
  # structural changes (added methods/fields) must be detected as supported and work.
  runtime-jbr:
    name: Runtime core on JetBrains Runtime ${{ matrix.jbr }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        jbr: ['21', '25']
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Download JetBrains Runtime ${{ matrix.jbr }}
        id: jbr
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ../scripts/ci/fetch-jbr.py ${{ matrix.jbr }} "$RUNNER_TEMP/jbr"
      - name: Show JVM and redefinition flag
        if: steps.jbr.outputs.java != ''
        run: |
          "${{ steps.jbr.outputs.java }}" -version
          "${{ steps.jbr.outputs.java }}" -XX:+AllowEnhancedClassRedefinition -XX:+PrintFlagsFinal -version | grep -E 'AllowEnhancedClassRedefinition'
      - name: Unit tests on JBR with -XX:+AllowEnhancedClassRedefinition
        if: steps.jbr.outputs.java != ''
        run: >
          ./gradlew :runtime-core:test --console=plain
          -PtestJava='${{ steps.jbr.outputs.java }}' -PtestJvmArgs=-XX:+AllowEnhancedClassRedefinition
      - name: Test summary
        if: always()
        run: python3 ../scripts/ci/junit-summary.py .

  # Compiles the Paper adapter, the example module and the test plugin against the public
  # Paper API of each version and packages them for the server tests.
  paper-modules:
    name: Paper adapter + example module ${{ matrix.mc }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: '1.21.11'
            java: '21'
            paper-api: '1.21.11-R0.1-SNAPSHOT'
          - mc: '26.1.2'
            java: '25'
            paper-api: '26.1.2.build.+'
          - mc: '26.2'
            java: '25'
            paper-api: '26.2.build.+'
          - mc: '26.3'
            java: '25'
            paper-api: '26.3.build.+'
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile adapter, build example module and test plugin
        run: >
          ./gradlew :runtime-paper:compileJava :example-module:assemble :example-plugin:jar --console=plain
          -PpaperApiVersion='${{ matrix.paper-api }}' -PjavaRelease=${{ matrix.java }}
      - name: Show resolved Paper API version
        run: ./gradlew :runtime-paper:dependencies --configuration compileClasspath -PpaperApiVersion='${{ matrix.paper-api }}' -PjavaRelease=${{ matrix.java }} --console=plain | grep -m1 "paper-api" || true
      - uses: actions/upload-artifact@v4
        with:
          name: example-module-${{ matrix.mc }}
          path: |
            runtime/example-module/build/libs/example-greeter.jar
            runtime/example-module/build/libs/example-greeter.jar.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: example-plugin-${{ matrix.mc }}
          path: runtime/example-plugin/build/libs/LemonTestPlugin.jar
          if-no-files-found: error

  # One independent paperweight fork build per supported Minecraft version.
  # Each version uses the JDK and paperweight version of its Paper upstream branch.
  fork:
    name: Fork ${{ matrix.mc }}
    needs: [runtime, paper-modules]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: '1.21.11'
            java: '21'
            paperclip-task: createMojmapPaperclipJar
          - mc: '26.1.2'
            java: '25'
            paperclip-task: createPaperclipJar
          - mc: '26.2'
            java: '25'
            paperclip-task: createPaperclipJar
          - mc: '26.3'
            java: '25'
            paperclip-task: createPaperclipJar
    defaults:
      run:
        working-directory: versions/${{ matrix.mc }}
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Configure Git user
        # gc.auto/maintenance.auto: paperweight copies freshly patched repositories (including .git);
        # a detached background "git gc --auto" can delete loose-object directories during that copy
        # (seen once as NoSuchFileException .git/objects/18 in runLemonSetup).
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git config --global gc.auto 0
          git config --global maintenance.auto false
      - name: List relevant paperweight tasks
        run: ./gradlew tasks --all --console=plain | grep -iE 'patch|paperclip|bundler|rundev|fixup' || true
      - name: Apply patches
        run: set -o pipefail; ./gradlew applyAllPatches --console=plain 2>&1 | tee -a "$RUNNER_TEMP/gradle.log"
      - name: List server patch tasks
        run: ./gradlew :lemon-server:tasks --all --console=plain | grep -iE 'patch|paperclip|bundler|rundev|fixup' || true
      - name: Build and test (includes Paper's own test suite)
        run: set -o pipefail; ./gradlew build --console=plain 2>&1 | tee -a "$RUNNER_TEMP/gradle.log"
      - name: Paper test summary
        if: always()
        run: python3 ../../scripts/ci/junit-summary.py .
      - name: Create paperclip jar
        run: set -o pipefail; ./gradlew ${{ matrix.paperclip-task }} --console=plain 2>&1 | tee -a "$RUNNER_TEMP/gradle.log"
      - name: Locate artifact
        id: jar
        run: |
          jar=$(find lemon-server/build/libs -maxdepth 1 -name '*paperclip*.jar' | head -n 1)
          if [ -z "$jar" ]; then echo "::error::no paperclip jar produced"; ls -la lemon-server/build/libs || true; exit 1; fi
          short=$(git rev-parse --short=8 HEAD)
          name="lemon-${{ matrix.mc }}-build.${{ github.run_number }}-${short}.jar"
          mkdir -p ../../dist && cp "$jar" "../../dist/$name"
          (cd ../../dist && sha256sum "$name" > "$name.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: "Server test 1: hot deployment disabled (default)"
        run: ../../scripts/ci/smoke-test.sh "../../dist/${{ steps.jar.outputs.name }}" "$RUNNER_TEMP/disabled" ../../scripts/ci/smoke-disabled.txt
      - name: Download example module
        id: module
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: example-module-${{ matrix.mc }}
          path: ${{ runner.temp }}/example-module
      - name: Require example module
        if: steps.module.outcome != 'success'
        run: echo "::error::example module for ${{ matrix.mc }} is missing (paper-modules job failed)" && exit 1
      - name: "Server test 2: hot deployment enabled, full module lifecycle"
        run: |
          ../../scripts/ci/prepare-runtime-server.sh "$RUNNER_TEMP/enabled" "$RUNNER_TEMP/example-module"
          ../../scripts/ci/smoke-test.sh "../../dist/${{ steps.jar.outputs.name }}" "$RUNNER_TEMP/enabled" ../../scripts/ci/smoke-runtime.txt
      - name: "Server test 3: runtime activation survives a restart"
        run: |
          ../../scripts/ci/prepare-runtime-server.sh "$RUNNER_TEMP/persist" "$RUNNER_TEMP/example-module"
          ../../scripts/ci/smoke-test.sh "../../dist/${{ steps.jar.outputs.name }}" "$RUNNER_TEMP/persist" ../../scripts/ci/smoke-persist-1.txt
          ../../scripts/ci/smoke-test.sh "../../dist/${{ steps.jar.outputs.name }}" "$RUNNER_TEMP/persist" ../../scripts/ci/smoke-persist-2.txt
      - name: Download live-patch agent
        id: agent
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: livepatch-agent
          path: ${{ runner.temp }}/agent
      - name: Require live-patch agent
        if: steps.agent.outcome != 'success'
        run: echo "::error::live-patch agent is missing (runtime job failed)" && exit 1
      - name: Add live-patch agent to the distribution
        run: |
          cp "$RUNNER_TEMP/agent/lemon-livepatch-agent.jar" ../../dist/
          (cd ../../dist && sha256sum lemon-livepatch-agent.jar > lemon-livepatch-agent.jar.sha256 && cat lemon-livepatch-agent.jar.sha256)
      # Core live patches built the way a developer builds them: baseline = the jar that was just
      # packaged into the paperclip jar, then a changed Paper source file, then createLivePatch.
      - name: Build core live patches from changed Paper sources
        id: patches
        run: |
          set -euo pipefail
          ./gradlew :lemon-server:livePatchBaseline --console=plain 2>&1 | tee -a "$RUNNER_TEMP/gradle.log"
          # Diagnostic: is the baseline the server jar that the paperclip jar runs?
          python3 ../../scripts/ci/lemonpatch.py compare-base "../../dist/${{ steps.jar.outputs.name }}" \
            lemon-server/build/livepatch/baseline/baseline.jar org.spigotmc.TicksPerSecondCommand
          # Diagnostic: the server jar paperclip actually created on disk in server test 1.
          srv=$(find "$RUNNER_TEMP/disabled/versions" -name '*.jar' | head -n 1 || true)
          if [ -n "$srv" ]; then
            echo "server jar created by paperclip: $srv"
            python3 ../../scripts/ci/lemonpatch.py compare-jars "$srv" lemon-server/build/livepatch/baseline/baseline.jar
            base="$PWD/lemon-server/build/livepatch/baseline/baseline.jar"
            for side in running:"$srv" baseline:"$base"; do
              d="$RUNNER_TEMP/tpsdiff/${side%%:*}"; mkdir -p "$d"
              (cd "$d" && unzip -q -o "${side#*:}" org/spigotmc/TicksPerSecondCommand.class && javap -c -p -v org/spigotmc/TicksPerSecondCommand.class > tps.txt) || true
            done
            diff "$RUNNER_TEMP/tpsdiff/running/tps.txt" "$RUNNER_TEMP/tpsdiff/baseline/tps.txt" | head -n 60 || true
          fi
          src=paper-server/src/main/java/org/spigotmc/TicksPerSecondCommand.java
          cp "$src" "$RUNNER_TEMP/TicksPerSecondCommand.java.orig"
          python3 ../../scripts/ci/edit-tps-source.py "$src" text
          ./gradlew :lemon-server:createLivePatch -PpatchId=tps-text -PpatchDescription="CI: /tps text changed" --console=plain 2>&1 | tee -a "$RUNNER_TEMP/gradle.log"
          cp "$RUNNER_TEMP/TicksPerSecondCommand.java.orig" "$src"
          python3 ../../scripts/ci/edit-tps-source.py "$src" structural
          ./gradlew :lemon-server:createLivePatch -PpatchId=tps-structural -PpatchDescription="CI: /tps label from a new method" --console=plain 2>&1 | tee -a "$RUNNER_TEMP/gradle.log"
          cp "$RUNNER_TEMP/TicksPerSecondCommand.java.orig" "$src"
          out="$RUNNER_TEMP/patches"
          mkdir -p "$out"
          cp lemon-server/build/livepatch/tps-*.lemonpatch lemon-server/build/livepatch/tps-*.lemonpatch.sha256 "$out/"
          base=lemon-server/build/livepatch/baseline/baseline.jar
          P=../../scripts/ci/lemonpatch.py
          python3 "$P" show "$out/tps-text.lemonpatch" --expect-classes org.spigotmc.TicksPerSecondCommand
          python3 "$P" show "$out/tps-structural.lemonpatch" --expect-classes org.spigotmc.TicksPerSecondCommand
          # Deliberately bad variants: the server must refuse every one of them.
          python3 "$P" variant "$out/tps-text.lemonpatch" "$out" --id tps-wrong-build --target-build "lemonpvp:lemon/0.0-WRONG/-"
          python3 "$P" variant "$out/tps-text.lemonpatch" "$out" --id tps-bad-checksum --bad-sidecar
          python3 "$P" variant "$out/tps-text.lemonpatch" "$out" --id tps-garbage --garbage-class org.spigotmc.TicksPerSecondCommand
          second=org.spigotmc.RestartCommand,org.spigotmc.SpigotCommand,org.spigotmc.WatchdogThread
          python3 "$P" variant "$out/tps-text.lemonpatch" "$out" --id tps-mixed --add-wrong-base "$second" --base-jar "$base"
          python3 "$P" variant "$out/tps-text.lemonpatch" "$out" --id tps-atomic --add-corrupt-class "$second" --base-jar "$base"
          ls -la "$out"
      - name: "Server test 4: core live patch (standard JVM, -javaagent)"
        run: |
          ../../scripts/ci/prepare-livepatch-server.sh "$RUNNER_TEMP/livepatch" "$RUNNER_TEMP/patches" lemon-server/build/livepatch/baseline/baseline.jar
          EXTRA_JVM_ARGS="-javaagent:$RUNNER_TEMP/agent/lemon-livepatch-agent.jar" \
            ../../scripts/ci/smoke-test.sh "../../dist/${{ steps.jar.outputs.name }}" "$RUNNER_TEMP/livepatch" ../../scripts/ci/smoke-livepatch.txt
      # Tests 5 and 6 run even if test 4 failed, so one failure does not hide the others.
      - name: Download test plugin
        id: plugin
        if: ${{ !cancelled() && steps.jar.outputs.name != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: example-plugin-${{ matrix.mc }}
          path: ${{ runner.temp }}/example-plugin
      - name: Require test plugin
        if: ${{ !cancelled() && steps.jar.outputs.name != '' && steps.plugin.outcome != 'success' }}
        run: echo "::error::test plugin for ${{ matrix.mc }} is missing (paper-modules job failed)" && exit 1
      - name: "Server test 5: live plugin updates"
        if: ${{ !cancelled() && steps.plugin.outcome == 'success' }}
        run: |
          ../../scripts/ci/prepare-plugin-server.sh "$RUNNER_TEMP/plugins" "$RUNNER_TEMP/example-plugin"
          ../../scripts/ci/smoke-test.sh "../../dist/${{ steps.jar.outputs.name }}" "$RUNNER_TEMP/plugins" ../../scripts/ci/smoke-plugins.txt
      - name: Download JetBrains Runtime ${{ matrix.java }}
        id: jbr
        if: ${{ !cancelled() && steps.patches.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ../../scripts/ci/fetch-jbr.py ${{ matrix.java }} "$RUNNER_TEMP/jbr"
      - name: "Server test 6: structural core patch on JetBrains Runtime"
        if: ${{ !cancelled() && steps.patches.outcome == 'success' && steps.jbr.outputs.java != '' }}
        run: |
          ../../scripts/ci/prepare-livepatch-server.sh "$RUNNER_TEMP/livepatch-jbr" "$RUNNER_TEMP/patches" lemon-server/build/livepatch/baseline/baseline.jar
          JAVA_BIN="${{ steps.jbr.outputs.java }}" \
          EXTRA_JVM_ARGS="-javaagent:$RUNNER_TEMP/agent/lemon-livepatch-agent.jar -XX:+AllowEnhancedClassRedefinition" \
            ../../scripts/ci/smoke-test.sh "../../dist/${{ steps.jar.outputs.name }}" "$RUNNER_TEMP/livepatch-jbr" ../../scripts/ci/smoke-livepatch-jbr.txt
      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs-${{ matrix.mc }}
          path: |
            ${{ runner.temp }}/disabled/server.log
            ${{ runner.temp }}/enabled/server.log
            ${{ runner.temp }}/enabled/lemon/logs/audit.log
            ${{ runner.temp }}/persist/server.log
            ${{ runner.temp }}/livepatch/server.log
            ${{ runner.temp }}/livepatch/lemon/logs/audit.log
            ${{ runner.temp }}/plugins/server.log
            ${{ runner.temp }}/plugins/lemon/logs/audit.log
            ${{ runner.temp }}/livepatch-jbr/server.log
          if-no-files-found: ignore
      - name: Upload server jar
        uses: actions/upload-artifact@v4
        with:
          name: lemon-${{ matrix.mc }}
          path: dist/
          if-no-files-found: error
      - name: Summarize Gradle failure
        if: failure()
        run: grep -n -A25 -E "What went wrong|FAILED|error:" "$RUNNER_TEMP/gradle.log" | head -n 150 || true
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.mc }}
          path: versions/${{ matrix.mc }}/**/build/reports/
          if-no-files-found: ignore
