name: Bug report
description: Something in PaperSwap does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check first:
        - **Security problem?** Do not post it here – see [SECURITY.md](https://github.com/luckyluci1026-stack/LemonPvP/blob/main/SECURITY.md).
        - **Does it also happen on plain Paper?** Then please report it to [PaperMC](https://github.com/PaperMC/Paper/issues).
        - Remove IP addresses, player data, passwords and tokens from everything you paste.
  - type: dropdown
    id: minecraft
    attributes:
      label: Minecraft version
      options:
        - "1.21.11"
        - "26.1.2"
        - "26.2"
        - "26.3"
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: PaperSwap build
      description: Commit hash or CI artifact name (e.g. `paperswap-26.2-build.<run>-<commit>.jar`).
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Modules (hot deployment)
        - Plugin live updates
        - Core patches / instrumentation
        - Fork build
        - Plain server behaviour (runtime disabled)
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: jvm
    attributes:
      label: JVM and flags
      description: Output of `java -version` and the full start command (JVM flags such as `-javaagent`, `-XX:+AllowEnhancedClassRedefinition`).
      render: text
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. config/paperswap.yml: …
        2. fork module enable …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Output of `fork version` and `fork live diagnostics` (and `fork instrumentation status` for core patches).
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: From `logs/latest.log` and, if relevant, `paperswap/logs/audit.log`.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I tested with the latest commit of the default branch.
        - label: I removed secrets, IP addresses and player data from the information above.
          required: true
