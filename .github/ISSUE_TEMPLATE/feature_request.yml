name: Feature request
description: Suggest an idea or improvement for PaperSwap.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? Commands, configuration, API …
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and limits
      description: |
        Does it load or change code at runtime? Who may trigger it, and what happens if it fails?
        Can the JVM actually do it (see docs/LIMITATIONS.md)?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
