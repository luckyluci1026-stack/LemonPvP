<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LearnDeveloping — Code lernen. Richtig lernen.</title>
  <meta name="description" content="KI-gestützte Lernplattform für 7 Programmiersprachen — von HTML bis C++." />

  <!--
    Favicon (Inline-SVG, kein externes Asset nötig).
    Bewusst dasselbe Zeichen wie das Logo in der Seite: ein weißes </> auf
    dem Farbverlauf — sonst sieht der Browser-Tab nach einer anderen Marke aus.
  -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234F8EF7'/%3E%3Cstop offset='1' stop-color='%237C3AED'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='url(%23g)'/%3E%3Cg stroke='%23ffffff' stroke-width='8' fill='none' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M36 34 L20 50 L36 66'/%3E%3Cpath d='M64 34 L80 50 L64 66'/%3E%3Cpath d='M57 26 L43 74'/%3E%3C/g%3E%3C/svg%3E" />

  <!-- Tailwind (CDN, JIT mit Arbitrary Values) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome Free (Icon-System) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!--
    Cloudflare Turnstile (Botschutz bei Registrierung/Login).
    Trage hier deinen Site-Key aus dem Cloudflare-Dashboard ein
    (Turnstile -> Add Site). Bleibt das Feld leer, wird das Widget
    ausgeblendet und die App funktioniert ohne Cloudflare weiter.
  -->
  <script>window.__TURNSTILE_SITE_KEY__ = "";</script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>

  <!-- React + Monaco (VS-Code-Editor) über Import Map -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/": "https://esm.sh/react@18.3.1/",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "@monaco-editor/react": "https://esm.sh/@monaco-editor/react@4.6.0?external=react,react-dom",
      "emmet-monaco-es": "https://esm.sh/emmet-monaco-es@5.5.0"
    }
  }
  </script>

  <!-- Monaco Web-Worker (VS-Code-Editor), an Version 0.52.2 gepinnt -->
  <script>
    window.MonacoEnvironment = {
      getWorkerUrl: function () {
        return URL.createObjectURL(new Blob([
          "self.MonacoEnvironment = { baseUrl: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/' };",
          "importScripts('https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/base/worker/workerMain.js');"
        ], { type: 'text/javascript' }));
      }
    };
  </script>

  <!-- Babel Standalone zum Transpilieren von App.jsx im Browser -->
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

  <style>
    html, body { margin: 0; background: #0A0E1A; color: #E8EDF5; font-family: 'Inter', system-ui, sans-serif; }
    #boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 24px; }
    .boot-spin { width: 40px; height: 40px; border: 3px solid #1E2D4A; border-top-color: #4F8EF7; border-radius: 50%; animation: bspin 1s linear infinite; }
    @keyframes bspin { to { transform: rotate(360deg); } }
    .boot-err { max-width: 560px; background: #141D35; border: 1px solid #1E2D4A; border-radius: 12px; padding: 20px; }
    .boot-err code { font-family: monospace; color: #EF4444; font-size: 13px; }
  </style>
</head>
<body>
  <div id="root">
    <div id="boot">
      <div class="boot-spin"></div>
      <p style="color:#8A9BC0">LearnDeveloping wird geladen …</p>
    </div>
  </div>

  <script type="module">
    // App.jsx laden, mit Babel transpilieren und als Modul ausführen.
    async function boot() {
      try {
        const src = await fetch('./App.jsx', { cache: 'no-store' }).then((r) => {
          if (!r.ok) throw new Error('App.jsx konnte nicht geladen werden (' + r.status + ')');
          return r.text();
        });
        const out = Babel.transform(src, {
          presets: [['react', { runtime: 'classic' }]],
          filename: 'App.jsx',
        }).code;
        const blob = new Blob([out], { type: 'text/javascript' });
        const url = URL.createObjectURL(blob);
        const mod = await import(url);
        const App = mod.default;
        const React = (await import('react')).default;
        const { createRoot } = await import('react-dom/client');
        createRoot(document.getElementById('root')).render(React.createElement(App));
      } catch (e) {
        document.getElementById('root').innerHTML =
          '<div id="boot"><div class="boot-err"><h2 style="margin:0 0 8px">App konnte nicht starten</h2>' +
          '<p style="color:#8A9BC0">Bitte über einen lokalen Webserver öffnen (nicht per <code>file://</code>), z. B.:</p>' +
          '<p><code>python3 -m http.server</code> &nbsp; oder &nbsp; <code>npx serve</code></p>' +
          '<p style="color:#4A5A7A;margin-top:12px">Fehler: <code>' + (e && e.message ? e.message : e) + '</code></p>' +
          '</div></div>';
        console.error(e);
      }
    }
    boot();
  </script>
</body>
</html>
