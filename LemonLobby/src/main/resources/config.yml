server-name: lobby
restart:
  time: "02:30"
  timezone: "Europe/Berlin"

# Hub double-jump: press the jump key twice to launch. Fall damage is disabled.
# Players with lemoncore.use.fly keep normal /fly instead.
double-jump:
  enabled: true
  forward-power: 1.0
  up-power: 0.9

# Golden Hour: a server-wide event that multiplies apple-tree rewards for a
# while, with a title + bossbar countdown. Fires automatically on the interval,
# or manually via /llobby goldenhour [minutes] [multiplier].
golden-hour:
  enabled: true
  interval-minutes: 60     # how often it auto-starts
  duration-seconds: 300    # how long each Golden Hour lasts
  multiplier: 2.0          # apple multiplier during the event

apple-tree:
  # World name where the apple tree is located
  world: world
  # Leaf materials that reward apples on right-click
  leaf-materials:
    - OAK_LEAVES
    - BIRCH_LEAVES
    - SPRUCE_LEAVES
    - ACACIA_LEAVES
    - DARK_OAK_LEAVES
    - JUNGLE_LEAVES
    - AZALEA_LEAVES
    - FLOWERING_AZALEA_LEAVES
  # Log materials that reward planks on right-click
  log-materials:
    - OAK_LOG
    - BIRCH_LOG
    - SPRUCE_LOG
    - ACACIA_LOG
    - DARK_OAK_LOG
    - JUNGLE_LOG
  # Cooldown between leaf clicks per player (in ticks, 20 = 1s)
  apple-cooldown-ticks: 20
  # Cooldown between log clicks per player (in ticks, 100 = 5s)
  plank-cooldown-ticks: 100
  # Base apples awarded per leaf click (before boosters)
  base-apples: 1
