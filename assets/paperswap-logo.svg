<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t">
  <title id="t">PaperSwap</title>
  <defs>
    <linearGradient id="swap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- sheet of paper with a folded corner -->
  <path d="M74 44h80l44 44v120a12 12 0 0 1-12 12H74a12 12 0 0 1-12-12V56a12 12 0 0 1 12-12z" fill="#f8fafc"/>
  <path d="M154 44v32a12 12 0 0 0 12 12h32z" fill="#cbd5e1"/>
  <!-- two arrows swapping -->
  <path d="M92 138a38 38 0 0 1 66-26" fill="none" stroke="url(#swap)" stroke-width="14" stroke-linecap="round"/>
  <path d="M146 96l20 13-18 18" fill="none" stroke="url(#swap)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M168 150a38 38 0 0 1-66 26" fill="none" stroke="url(#swap)" stroke-width="14" stroke-linecap="round"/>
  <path d="M114 192l-20-13 18-18" fill="none" stroke="url(#swap)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
