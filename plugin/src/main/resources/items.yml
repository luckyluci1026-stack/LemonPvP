  bollwerkschild:
    material: SHIELD
    custom-model-data: 3006
    bedrock-identifier: "geyser_custom:bollwerkschild"
    # "none" = kein Custom-Modell. Ein Schild hat ein Sondermodell (3D, Block-
    # Animation); wuerden wir es ersetzen, verlieren alle Schilde auf dem Server
    # ihr Aussehen und Bedrock-Spieler koennten damit nicht mehr blocken.
    # Das Bollwerk-Schild bleibt deshalb optisch ein Vanilla-Schild - mit
    # eigenem Namen, eigener Lore und der Schildwall-Faehigkeit.
    model: none
    display: "&7&lBollwerk-Schild"
    lore:
      - "&7Haelt, was das Team nicht halten kann."
      - ""
      - "&8» &fSchleichen + Rechtsklick: &aSchildwall"
    unbreakable: true
