# =====================================================================
#  Custom-Items ("Artefakte")
#
#  custom-model-data  -> Java-Resourcepack (resourcepack/java)
#  bedrock-identifier -> Geyser-Mapping    (geyser/custom_mappings)
#
#  Beide Packs liegen im Repository unter /resourcepack. Wenn du hier eine
#  custom-model-data aenderst, musst du sie auch im Geyser-Mapping und im
#  Java-Pack anpassen - sonst sehen Bedrock-Spieler das Vanilla-Item.
# =====================================================================

items:

  zitronenklinge:
    material: DIAMOND_SWORD
    custom-model-data: 3001
    bedrock-identifier: "geyser_custom:zitronenklinge"
    # Nur fuer die Resourcepacks: handheld = Werkzeugoptik, generated = flaches Icon
    model: handheld
    display: "&e&lZitronenklinge"
    lore:
      - "&7Geschmiedet aus dem Herz des Zitronenhains."
      - ""
      - "&8» &fSchleichen + Rechtsklick: &aWirbelsturm"
    unbreakable: true
    glow: true
    hide-flags: true
    enchantments:
