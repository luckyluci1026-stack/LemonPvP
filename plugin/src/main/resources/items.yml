# =====================================================================
#  Custom-Items ("Artefakte")
#
#  custom-model-data  -> Java-Resourcepack (resourcepack/java)
#  bedrock-identifier -> Geyser-Mapping    (geyser/custom_mappings)
#  model              -> handheld = Werkzeugoptik, generated = flaches Icon,
#                        none = kein Custom-Modell (Vanilla-Optik behalten)
#
#  Beide Packs liegen im Repository unter /resourcepack und werden aus dieser
#  Datei erzeugt:  python3 tools/build_packs.py
# =====================================================================

items:

  herz:
    material: RED_DYE
    custom-model-data: 3001
    bedrock-identifier: "geyser_custom:herz"
    model: generated
    display: "&c&lHerz"
    lore:
      - "&7Ein zusaetzliches Herz."
      - "&8Nicht Teil des Originalregelwerks -"
      - "&8abschaltbar ueber special-items.heart."
      - ""
      - "&8» &fRechtsklick: &c+1 ♥"
    glow: true
    hide-flags: true
