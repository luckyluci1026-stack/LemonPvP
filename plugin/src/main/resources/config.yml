# =====================================================================
#  Helden 3 - LemonPvP
#  Regelwerk nach dem Minecraft-Helden-Projekt
# =====================================================================

general:
  prefix: "&8[&c&l♥&8] &r"
  project-name: "&c&lHELDEN &f&l3"
  # Speicherintervall der Spielerdaten in Sekunden.
  autosave-seconds: 300

hearts:
  # Eigene Herzen pro Spieler.
  start: 3
  # Zusaetzliches, geteiltes Link-Herz. Damit startet jeder mit 4 Herzen
  # (= 8 Lebenspunkte); das letzte ist das Link-Herz.
  link-heart: true
  # Obergrenze, falls Herzen wieder vergeben werden (Herz-Item, Admin).
  max: 6

  # DIE Kernregel des Projekts: Herzen gehen NUR durch andere Spieler
  # verloren. Sturz, Lava, Mobs, Hunger und Ertrinken kosten kein Herz.
  pvp-only: true
  # So lange nach einem Treffer zaehlt ein Tod noch als PvP-Kill des
  # Angreifers - auch wenn das Opfer danach in die Lava faellt.
  pvp-credit-seconds: 15

link:
  # Wird der zugeloste Partner oeffentlich bekanntgegeben?
  announce: true
  # Neu auslosen, wenn der Partner ausscheidet.
  reassign-on-partner-out: true
  # Darf ein Spieler Partner mehrerer Link-Herzen sein?
  allow-multiple: false

dummy:
  # Wer sich im Kampf ausloggt, verliert nicht sofort ein Herz - stattdessen
  # bleibt ein Dummy mit seiner Ausruestung stehen. Wird der getoetet, sind
  # Herz und Loot weg.
  enabled: true
  # Sekunden, die der Dummy stehen bleibt.
  lifetime-seconds: 180
  # Nur Spieler duerfen dem Dummy schaden (sonst raeumen ihn Mobs ab).
  players-only: true
  # Name ueber dem Dummy.
  name-format: "&c%player% &7(Dummy)"

game:
  # Was passiert bei 0 Herzen?  SPECTATOR | KICK | NOTHING
  on-elimination: SPECTATOR
  # Ab so vielen Teilnehmern wird ein Sieger verkuendet.
  min-participants: 2
  announce-winner: true
  # Eliminierte Spieler beim Join direkt in den Zuschauermodus setzen.
  enforce-on-join: true

combat:
  # Sekunden, die ein Spieler nach einem Treffer im Kampf ist.
  tag-seconds: 15
  # Praktische Zugabe, im Original nicht bestaetigt: kurzer Schutz nach dem
  # Respawn, damit niemand am Spawn festgehalten wird. 0 = aus.
  respawn-protection-seconds: 5

hud:
  enabled: true
  title: "&c&lHELDEN &f&l3"
  update-ticks: 20
  lines:
    - "&7&m----------------"
    - "&fHerzen: &c%hearts%"
    - "&fLink: %link%"
    - ""
    - "&fKills: &a%kills%"
    - "&fPvP-Tode: &c%deaths%"
    - ""
    - "&fUebrig: &e%alive%&7/&f%participants%"
    - "&fStatus: %status%"
    - "&7&m----------------"
    - "&alemonpvp.de"

special-items:
  # Artefakt-ID aus items.yml, das ein Herz gibt. Leer lassen zum Abschalten.
  # Nicht aus dem Original bestaetigt - praktisch fuer Comebacks und Admins.
  heart: herz
  heart-value: 1

bedrock:
  # Bedrock-Spieler ueber Floodgate erkennen (Reflection, keine Dependency).
  detect-floodgate: true
  # Muss mit "username-prefix" aus der Floodgate-Config uebereinstimmen.
  username-prefix: "."
  # Bedrock rendert keine Hex-Farben -> auf Legacy-Farben reduzieren.
  strip-hex-colors: true
  send-controls-hint: true

world:
  # Spawnpunkt. Wird mit /helden3 spawn gesetzt, sonst World-Spawn.
  spawn:
    world: ""
    x: 0.0
    y: 0.0
    z: 0.0
    yaw: 0.0
    pitch: 0.0

storage:
  # Aktuell unterstuetzt: YAML (data/players.yml)
  type: YAML
