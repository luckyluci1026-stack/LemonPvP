# =====================================================================
#  Helden 3 - LemonPvP YouTuber-Projekt
#  Hauptkonfiguration
# =====================================================================

general:
  # Prefix vor allen Plugin-Nachrichten (siehe messages.yml fuer den Rest).
  prefix: "&8[&e&lHelden&a&l3&8] &r"
  # Sprache der Item-/Held-Namen: rein kosmetisch, alles kommt aus den YMLs.
  project-name: "&e&lHELDEN &a&l3"
  # Speicherintervall der Spielerdaten in Sekunden.
  autosave-seconds: 300

bedrock:
  # Bedrock-Spieler ueber Floodgate erkennen (Reflection, keine Dependency).
  detect-floodgate: true
  # Fallback: Spielernamen mit diesem Prefix gelten als Bedrock-Spieler.
  # Muss mit "username-prefix" aus der Floodgate-Config uebereinstimmen.
  username-prefix: "."
  # Bedrock-Clients rendern Hex-Farben nicht. Ist das an, werden &#RRGGBB
  # Codes fuer Bedrock-Spieler auf die naechste Legacy-Farbe reduziert.
  strip-hex-colors: true
  # Bedrock-Inventare zeigen nur begrenzt Zeilen sauber an -> GUIs kleiner halten.
  compact-menus: true
  # Beim Join einen Hinweis senden, wie die Faehigkeit ausgeloest wird.
  send-controls-hint: true

hero:
  # Wie wird die Faehigkeit ausgeloest?
  #   SNEAK_RIGHT_CLICK - Schleichen + Rechtsklick mit der Heldenwaffe.
  #                       Empfohlen: Bogen und Schild behalten so ihre normale
  #                       Funktion, der Bogenschuetze kann also weiter schiessen.
  #   RIGHT_CLICK       - Einfacher Rechtsklick mit der Heldenwaffe.
  # /faehigkeit funktioniert in beiden Faellen zusaetzlich.
  ability-trigger: SNEAK_RIGHT_CLICK
  # Held beim ersten Join automatisch abfragen (GUI oeffnet sich).
  select-on-first-join: true
  # Wie viele Sekunden nach dem Waehlen darf gewechselt werden?
  # -1 = immer erlaubt, 0 = nie wechseln.
  change-cooldown-seconds: 3600
  # Passive Effekte alle X Sekunden erneuern.
  passive-refresh-seconds: 5

lives:
  enabled: true
  # Startleben pro Spieler.
  start: 3
  # Maximale Leben (Lebenskristalle koennen nicht darueber hinaus heilen).
  max: 6
  # Was passiert bei 0 Leben?  SPECTATOR | KICK | NOTHING
  on-zero: SPECTATOR
  # Spieler mit 0 Leben duerfen sich per Heldenherz wiederbeleben lassen.
  revive-enabled: true
  # Wiederbelebung kostet zusaetzlich Zitronen (0 = kostenlos).
  revive-cost: 250
  # Nach einer Wiederbelebung erhaltene Leben.
  revive-lives: 1
  # Sekunden Schutz nach der Wiederbelebung.
  revive-protection-seconds: 15

combat:
  # Friendly Fire innerhalb eines Teams.
  team-friendly-fire: false
  # Sekunden, die ein Spieler nach einem Treffer im Kampf ist (Combat-Log).
  tag-seconds: 15
  # Beim Verlassen im Kampf: Spieler stirbt (klassische Projekt-Regel).
  kill-on-combat-log: true
  # Sekunden Spawnschutz nach dem Respawn.
  respawn-protection-seconds: 10
  # Killstreak-Ankuendigung ab dieser Anzahl.
  announce-killstreak-from: 3

economy:
  # Name der Waehrung (LemonPvP -> Zitronen).
  name: "Zitronen"
  symbol: "&e⬤"
  start-balance: 100
  reward-per-kill: 50
  # Bonus pro Kill in der aktuellen Killstreak (kill * bonus).
  killstreak-bonus: 10
  reward-per-assist: 15
  # Verlust pro Tod (0 = keiner).
  loss-per-death: 0

hud:
  enabled: true
  title: "&e&lHELDEN &a&l3"
  update-ticks: 20
  lines:
    - "&7&m----------------"
    - "&fHeld: &e%hero%"
    - "&fTeam: %team%"
    - "&fLeben: &c%lives%"
    - ""
    - "&fKills: &a%kills%"
    - "&fTode: &c%deaths%"
    - "&fStreak: &6%streak%"
    - ""
    - "&f%currency%: &e%coins%"
    - "&fEvent: %event%"
    - "&7&m----------------"
    - "&alemonpvp.de"
  # Nametags/Tablist nach Team einfaerben.
  color-nametags: true

events:
  enabled: true
  # Minuten zwischen zwei automatischen Events.
  interval-minutes: 45
  # Vorwarnung in Sekunden.
  warmup-seconds: 30
  # Welche Events duerfen automatisch starten?
  rotation:
    - blutmond
    - zitronenregen
    - kopfgeld
  blutmond:
    duration-seconds: 600
    # Zusaetzlicher PvP-Schaden in Prozent.
    damage-bonus-percent: 20
    # Nachts erzwingen.
    set-night: true
  zitronenregen:
    duration-seconds: 180
    # Sekunden zwischen zwei Drops.
    drop-interval-seconds: 10
    # Radius um den Spawn, in dem gedroppt wird.
    radius: 12
    zitronen-per-drop: 3
  kopfgeld:
    duration-seconds: 900
    # Zitronen fuer den Kill des Zielspielers.
    reward: 1000

special-items:
  # Welche Artefakt-IDs (items.yml) welche Funktion haben.
  revive: heldenherz
  life-crystal: lebenskristall
  currency-token: zitrone
  return-stone: rueckkehrstein
  # Wert einer eingeloesten Zitrone.
  currency-token-value: 50

world:
  # Spawnpunkt. Wird mit /helden3 spawn gesetzt, sonst World-Spawn.
  spawn:
    world: ""
    x: 0.0
    y: 0.0
    z: 0.0
    yaw: 0.0
    pitch: 0.0

storage:
  # Aktuell unterstuetzt: YAML (data/players.yml)
  type: YAML
