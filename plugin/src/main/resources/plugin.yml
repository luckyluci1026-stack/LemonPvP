name: Helden3
version: ${project.version}
main: de.lemonpvp.helden.HeldenPlugin
api-version: '1.21'
authors: [LemonPvP]
description: Helden 3 - Herzen-Projekt nach dem Minecraft-Helden-Regelwerk, fuer Java- und Bedrock-Spieler.
website: https://lemonpvp.de
softdepend: [floodgate, Geyser-Spigot]

commands:
  herzen:
    description: Zeigt die verbleibenden Herzen an.
    usage: /herzen [spieler]
    aliases: [herz, hearts, hp]
  teilnehmer:
    description: Uebersicht aller Teilnehmer mit Herzen und Status.
    usage: /teilnehmer
    aliases: [spieler, liste, players]
  stats:
    description: Zeigt die Statistiken eines Spielers.
    usage: /stats [spieler]
    aliases: [statistik]
  helden3:
    description: Adminbefehle fuer das Helden-3-Projekt.
    usage: /helden3 <reload|status|herzen|link|raus|zurueck|dummy|item|reset|spawn>
    aliases: [h3, heldenadmin]

permissions:
  helden3.play:
    description: Grundlegende Spielerbefehle.
    default: true
    children:
      helden3.command.hearts: true
      helden3.command.list: true
      helden3.command.stats: true
  helden3.command.hearts:
    default: true
  helden3.command.list:
    default: true
  helden3.command.stats:
    default: true
  helden3.admin:
    description: Voller Adminzugriff auf das Projekt.
    default: op
    children:
      helden3.play: true
