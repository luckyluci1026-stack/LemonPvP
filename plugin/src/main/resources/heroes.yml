# =====================================================================
#  Die Helden von Helden 3
#
#  ability            -> ID einer registrierten Faehigkeit (siehe /helden3 status)
#  weapon             -> Custom-Item aus items.yml, mit dem die Faehigkeit
#                        per Rechtsklick ausgeloest wird
#  passives.effects   -> "EFFEKTNAME:staerke", Namen wie in Minecraft
#                        (SPEED, STRENGTH, RESISTANCE, REGENERATION,
#                         HEALTH_BOOST, JUMP_BOOST, HASTE, FIRE_RESISTANCE ...)
#  kit.slot           -> 0-35 Inventar, 36 Schuhe, 37 Hose, 38 Brust,
#                        39 Helm, 40 Zweithand
# =====================================================================

heroes:

  krieger:
    display: "&c&lKrieger"
    icon: DIAMOND_SWORD
    order: 1
    description:
      - "&7Der Fels in der Schlachtreihe."
      - "&7Viel Leben, viel Schaden, wenig Geduld."
    ability: wirbelsturm
    weapon: zitronenklinge
    passives:
      effects:
        - "HEALTH_BOOST:1"
        - "RESISTANCE:0"
      damage-dealt-multiplier: 1.10
      damage-taken-multiplier: 1.00
    kit:
      - item: zitronenklinge
        slot: 0
      - material: COOKED_BEEF
        amount: 16
        slot: 8
      - material: IRON_BOOTS
        slot: 36
      - material: IRON_LEGGINGS
        slot: 37
      - material: IRON_CHESTPLATE
        slot: 38
      - material: IRON_HELMET
