# LemonCore Word Filter
# Words/patterns that trigger auto-mute
# Use * as wildcard, supports leetspeak variants

nword-patterns:
  # Direct and common variants
  - "nigger"
  - "nigga"
  - "nigg3r"
  - "nigg4"
  - "n1gger"
  - "n1gga"
  - "n!gger"
  - "n!gga"
  - "n1gg3r"
  - "n!gg3r"
  - "niqqa"
  - "niqqer"
  - "niggah"
  - "nigguh"
  - "niggur"
  - "n-word"
  - "nword"
  - "negro"
  - "negroid"
  # Spaced/partial
  - "n i g g e r"
  - "n i g g a"
  - "n.i.g.g.e.r"
  - "n.i.g.g.a"
  # Common misspellings
  - "neger"
  - "niga"
  - "nigr"
  - "nigar"
  - "niggr"
  - "niggaz"
  - "nigguz"
  - "niggaz"

