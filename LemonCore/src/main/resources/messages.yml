restart:
  five-min: "<bold><gradient:#fffb00:#00ff00>»</gradient></bold> <yellow>Server Restart in 5 Minutes <<"
  three-min: "<bold><gradient:#fffb00:#00ff00>»</gradient></bold> <yellow>Server Restart in 3 Minutes <<"
  one-min: "<bold><gradient:#fffb00:#00ff00>»</gradient></bold> <yellow>Server Restart in 1 Minute <<"
  thirty-sec: "<bold><gradient:#fffb00:#00ff00>»</gradient></bold> <yellow>Server Restart in 30 Seconds <<"
  warning-15: "<bold><gradient:gold:dark_orange>Warning</gradient></bold>\n<yellow>Restart in 15 Seconds"
  warning-10: "<bold><gradient:gold:dark_orange>Warning</gradient></bold>\n<yellow>Restart in 10 Seconds"
  countdown: "<bold><gradient:gold:dark_orange>Warning</gradient></bold>\n<yellow>Restart in {seconds} Seconds"
  now-chat: "<bold><red>Restart</red></bold>"
  now-title: "<bold><red>Restart</red></bold>"
  initiated: "{prefix} <green>Restart sequence initiated."
