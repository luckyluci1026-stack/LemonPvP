# LemonCore Messages
prefix: "<bold><gradient:#fffb00:#00ff00>LemonPvP</gradient></bold> <dark_gray>»</dark_gray>"

no-permission: "{prefix} <red>You do not have permission to use this command."
player-not-found: "{prefix} <red>Player not found: <white>{player}"
player-not-online: "{prefix} <red>Player <white>{player} <red>is not online."
invalid-usage: "{prefix} <red>Usage: <white>{usage}"
invalid-amount: "{prefix} <red>Please enter a valid number."

rank:
  show: "{prefix} <gray>Your rank: <white>{rank}"
  set: "{prefix} <green>Set rank of <white>{player} <green>to <white>{rank}"
  add: "{prefix} <green>Added rank <white>{rank} <green>to <white>{player}"
  remove: "{prefix} <green>Removed rank <white>{rank} <green>from <white>{player}"
  show-other: "{prefix} <gray>Rank of <white>{player}<gray>: <white>{rank}"

coins:
  show: "{prefix} <#fffb00>Your coins: <white>{coins}"
  add: "{prefix} <green>Added <#fffb00>{amount} <green>coins to <white>{player}"
  remove: "{prefix} <red>Removed <#fffb00>{amount} <red>coins from <white>{player}"
  set: "{prefix} <green>Set coins of <white>{player} <green>to <#fffb00>{amount}"
  show-other: "{prefix} <gray>Coins of <white>{player}<gray>: <#fffb00>{coins}"
  coinsall: "{prefix} <green>Gave <#fffb00>{amount} <green>coins to all online players."
  receive: "{prefix} <green>You received <#fffb00>{amount} <green>coins!"

ban:
  temp: "<red>Dein Account wurde für <white>{reason} <red>gesperrt."
  permanent: "<red>Dein Account wurde dauerhaft gesperrt."
  permanent-label: "Dauerhaft"
  ban-id: "<gray>Bann-ID: <white>{id}"
  duration: "<gray>Dauer: <white>{duration}"
  appeal: "<gray>Einspruch auf unserem Discord: <aqua>{discord}"
  success: "{prefix} <green>Banned <white>{player} <green>for <white>{reason}"
  lemonizer: "<bold><gradient:#fffb00:#00ff00>Lemonizer</gradient></bold> <red>{player}</red> <green>has been banned for</green> <red>{reason}</red>"
  unban-success: "{prefix} <green>Unbanned <white>{player}"
  not-banned: "{prefix} <red>{player} is not currently banned."
  already-banned: "{prefix} <red>{player} is already banned."

mute:
  muted: "{prefix} <red>You are muted and cannot send messages."
  muted-duration: "{prefix} <red>You are muted for <white>{duration}"
  success: "{prefix} <green>Muted <white>{player}"
  unmute-success: "{prefix} <green>Unmuted <white>{player}"
  not-muted: "{prefix} <red>{player} is not muted."

kick:
  success: "{prefix} <green>Kicked <white>{player} <green>for <white>{reason}"
  message: "<red>You have been kicked for: <white>{reason}"

code:
  success-header: "<bold><gradient:#fffb00:#00ff00>» Code redeemed! «</gradient></bold>"
  success-reward: "<gray>Your Reward: <white>{reward}"
  success-footer: ""
  invalid: "{prefix} <red>Invalid code — please check the spelling."
  create: "{prefix} <green>Code <white>{code} <green>created successfully."
  already-redeemed: "{prefix} <red>You have already redeemed this code."
  expired: "{prefix} <red>This code has expired."

report:
  success: "{prefix} <green>Report submitted successfully."
  already-reported: "{prefix} <red>You have already reported this player recently."
  self-report: "{prefix} <red>You cannot report yourself."
  gui-title: "Reports"

bug:
  success: "{prefix} <green>Bug report submitted successfully."
  gui-title: "Bug Reports"

mreport:
  success: "{prefix} <green>Message report submitted successfully."
  gui-title: "Message Reports"

stats:
  gui-title: "Stats - {player}"
  wipe-success: "{prefix} <green>Wiped stats for <white>{player}"
  unwipe-success: "{prefix} <green>Restored stats for <white>{player} <green>from <white>{date}"
  no-wipe: "{prefix} <red>No wipe found for that date."

settings:
  gui-title: "Settings"
  public-chat-on: "<green>Public Chat: ON"
