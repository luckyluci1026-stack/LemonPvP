recording:
  enabled: "{prefix} <red>Recording mode enabled."
  disabled: "{prefix} <green>Recording mode disabled."

nick:
  set: "{prefix} <green>Your nick has been set to <white>{nick}"
  cleared: "{prefix} <green>Your nick has been cleared."

hide:
  set: "{prefix} <green>Your display name has been set to <white>{name}"

history:
  gui-title: "History - {player}"
  no-history: "{prefix} <red>No history found for <white>{player}"

teleport:
  success: "{prefix} <green>Teleported to <white>{player}"
  spawn: "{prefix} <green>Teleported to spawn."
  lobby-set: "{prefix} <green>Lobby spawn set."

spectator:
  enabled: "{prefix} <green>Spectator mode enabled."
  survival: "{prefix} <green>Survival mode enabled."

chat:
  muted-player: "{prefix} <red>Your message was blocked (muted)."
