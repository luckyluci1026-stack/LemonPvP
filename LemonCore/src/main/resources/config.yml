lobby:
  spawn:
    world: world
    x: 0.5
    y: 64.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0

scoreboard:
  enabled: true
  title: "<bold><gradient:#fffb00:#00ff00>LᴇᴍᴏɴPᴠP</gradient></bold>"
  lines:
    - "<dark_gray><st>                </st>"
    - "<white>Willkommen,"
    - "<gradient:#fffb00:#00ff00>{player}</gradient>"
    - " "
    - "<gray>Kills: <green>{kills}"
    - "<gray>Deaths: <red>{deaths}"
    - "<gray>K/D: <white>{kdr}"
    - "<gray>Killstreak: <gold>{killstreak}"
    - " "
    - "<gray>Münzen: <gold>{coins} ⭐"
    - "<gray>Online: <green>{online}"
    - "<dark_gray><st>                </st>"
    - "<yellow>play.lemonpvp.de"

ban:
  reasons:
    hacking: 30d
    cheating: 30d
    cheat: 30d
    racism: 3d
    spam: 1d
    advertising: 7d
    harassment: 7d
    exploiting: 14d
    default: 7d
  default-duration: "7d"

# Schnell-Strafen mit festem Grund + fester Dauer aus dieser Config.
#   /offend <player>  → temporärer Bann (duration + reason unten)
#   /punish <player>  → permanenter Bann (reason unten)
offend:
  duration: "7d"
  reason: "Regelverstoß"
punish:
  reason: "Schwerwiegender Regelverstoß"

mute:
  default-duration: "1d"
  reasons:
    spam: 1h
    advertising: 7d
    harassment: 1d
    toxicity: 3d
    default: 1d

anti-swear:
  enabled: true
  nword:
    first-offense-duration: "3d"
    second-offense-duration: "14d"
  other-insult-duration: "1d"

http-api:
  enabled: true
  # bind: which network interface to listen on.
  #   127.0.0.1 — only reachable from this machine (use when panel is on the same host)
  #   0.0.0.0   — reachable on all interfaces (use when panel is on a different server)
  # IMPORTANT: if you use 0.0.0.0, add a firewall rule on this machine that
  # only allows the panel server's IP on this port. Example (ufw):
  #   ufw allow from <PANEL_SERVER_IP> to any port 8080
  bind: "0.0.0.0"
  port: 8080
  key: "change-me-in-production"

velocity:
  channel: "lemonpvp:core"

