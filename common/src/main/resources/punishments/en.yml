# ======================================================================
#  BuckSMPAC - Punishments
# ======================================================================
# Placeholders:
#   %check_name%  - name of the check
#   %description% - description of the check
#   %vl%          - violations
#   %verbose%     - extra information
#   %player%      - player name
#
# Special commands:
#   [alert]   - notify staff in-game
#   [log]     - write to BuckSMPAC violation history
#   [webhook] - send to your Discord webhook
#   [proxy]   - broadcast to other servers via your proxy (Bungee/Velocity)
#
# Command format:  "Threshold:Interval Command"
#   N is the violation count required to run the command.
#   M > 0 -> runs at N, then N+M, N+2M, ...
#   M = 0 -> runs once when N is reached.
#   Examples:
#     "8:0 ban %player% cheating"      -> fires once on flag 8
#     "5:3 [alert]"                    -> fires on flags 5, 8, 11, 14, ...
#
# ----------------------------------------------------------------------
#  BANS ONLY — no kicks, no freezes
# ----------------------------------------------------------------------
# Every group below has exactly one punishment: a temporary ban. Nothing
# here bans forever - the length is per group, longer where the check
# almost never misfires and shorter where it sometimes does.
#
#   group        flags   ban
#   Reach          14    14 days
#   Hitboxes       14    14 days
#   Post           20    14 days
#   BadPackets     20    14 days
#   Knockback      25    10 days
#   Combat         25    10 days
#   Misc           32     7 days
#   Simulation    100     7 days
#
# A flag stops counting 450 seconds after it happened, so a player has to
# be flagged repeatedly in one sitting to reach a ban - the odd false
# positive spread over an evening cools off instead of adding up.
#
# Simulation sits far above the rest on purpose: it is the check that
# misfires most under lag, and it is the first number to raise if
# legitimate players start disappearing.
#
# STILL WORTH DOING: run with the BAN lines commented out for a few days
# and check the alerts actually name cheaters before letting it ban.
#
# ----------------------------------------------------------------------
#  /acban — BUCKSMPAC'S OWN BAN
# ----------------------------------------------------------------------
# Not another plugin's command: nothing to install, nothing to configure,
# and it cannot silently do nothing because a ban plugin lives elsewhere.
#
#   /acban <player> [duration] [reason]     e.g.  /acban Steve 7d flying
#   /acunban <player>
#
# The duration is optional: 7d, 12h, 30m, or perm. Leave it out and the
# ban lasts acban-default-duration from messages.yml (10 days).
#
# With the Velocity plugin installed, the ban is enforced at the proxy -
# a banned player is refused before they reach any server. Without it, the
# ban still applies on every backend running BuckSMPAC.
#
# Want an external plugin instead? Replace acban with its command, e.g.
#   "14:0 tempban %player% 30d BuckSMPAC > Cheating (%check_name%)"
# ----------------------------------------------------------------------

Punishments:
  Simulation:
    # After how many seconds should a violation be removed?
    remove-violations-after: 450
    checks:
      - "Simulation"
      - "GroundSpoof"
      - "Timer"
      - "TimerLimit"
      - "NoFall"
    commands:
      - "40:20 [alert]"
      - "1:1 [log]"
      - "100:100 [webhook]"
      - "100:100 [proxy]"
      # --- BuckSMPAC punishment ladder ---
      - "100:0 acban %player% 7d BuckSMPAC > Cheating detected (%check_name%)"      # BAN

  Knockback:
    remove-violations-after: 450
    checks:
      - "Knockback"
      - "Explosion"
    commands:
      - "8:8 [alert]"
      - "1:1 [log]"
      - "20:20 [webhook]"
      - "20:20 [proxy]"
      # --- BuckSMPAC punishment ladder ---
      - "25:0 acban %player% 10d BuckSMPAC > Anti-Knockback (%check_name%)"          # BAN

  Post:
    remove-violations-after: 450
    checks:
      - "Post"
    commands:
      - "12:12 [alert]"
      - "1:1 [log]"
      - "40:40 [webhook]"
      - "40:40 [proxy]"
      # --- BuckSMPAC punishment ladder (Post is very reliable) ---
      - "20:0 acban %player% 14d BuckSMPAC > Packet order (%check_name%)"          # BAN

  BadPackets:
    remove-violations-after: 450
    checks:
      - "BadPackets"
      - "PacketOrder"
      - "Crash"
    commands:
      - "12:12 [alert]"
      - "1:1 [log]"
      - "40:40 [webhook]"
      - "40:40 [proxy]"
      # --- BuckSMPAC punishment ladder (BadPackets is very reliable) ---
      - "20:0 acban %player% 14d BuckSMPAC > Illegal packets (%check_name%)"         # BAN

  Reach:
    remove-violations-after: 450
    checks:
      - "Reach"
    commands:
      - "6:4 [alert]"
      - "1:1 [log]"
      - "5:3 [webhook]"
      - "5:3 [proxy]"
      # --- BuckSMPAC punishment ladder (Reach is very reliable) ---
      - "14:0 acban %player% 14d BuckSMPAC > Reach detected (%check_name%)"          # BAN

  Hitboxes:
    remove-violations-after: 450
    checks:
      - "Hitboxes"
    commands:
      - "6:4 [alert]"
      - "1:1 [log]"
      - "5:3 [webhook]"
      - "5:3 [proxy]"
      # --- BuckSMPAC punishment ladder ---
      - "14:0 acban %player% 14d BuckSMPAC > Hitbox detected (%check_name%)"         # BAN

  Misc:
    remove-violations-after: 450
    checks:
      - "Vehicle"
      - "NoSlow"
      - "Sprint"
      - "MultiActions"
      - "Place"
      - "Baritone"
      - "Break"
      - "TransactionOrder"
      - "Elytra"
      - "Chat"
      - "Exploit"
    commands:
      - "8:5 [alert]"
      - "1:1 [log]"
      - "20:10 [webhook]"
      - "20:10 [proxy]"
      # --- BuckSMPAC punishment ladder ---
      - "32:0 acban %player% 7d BuckSMPAC > Cheating detected (%check_name%)"      # BAN

  Combat:
    remove-violations-after: 450
    checks:
      - "Interact"
      - "Aim"
    commands:
      - "12:15 [alert]"
      - "1:1 [log]"
      # --- BuckSMPAC punishment ladder ---
      - "25:0 acban %player% 10d BuckSMPAC > Combat anomaly (%check_name%)"         # BAN

  # BuckSMPAC's own AutoClicker check. It is marked experimental, and BuckSMPAC
  # ships with experimental-checks: true - so it IS running.
  #
  # DELIBERATELY ALERTS ONLY. Every other group here punishes a check that
  # upstream has years of field data on; this one is new code with none. Watch
  # the alerts on your own server first, confirm the players it names are
  # actually cheating, tune Autoclicker.max-attack-cps in config.yml to sit
  # above your fastest legitimate clicker, and only then uncomment the ladder
  # below. Enabling it untested will ban butterfly clickers.
  Autoclicker:
    remove-violations-after: 450
    checks:
      - "Autoclicker"
    commands:
      - "15:20 [alert]"
      - "1:1 [log]"
      # --- BuckSMPAC punishment ladder (enable only after tuning - see above) ---
      #- "120:0 acban %player% BuckSMPAC > AutoClicker (%check_name%)"           # BAN

# Bump marker — BuckSMPAC compares this against the version it ships and
# warns in the console when yours is older. This file is never overwritten
# automatically, so the warning is the only way you would find out.
punishments-version: 7
