      - "5:3 [webhook]"
      - "5:3 [proxy]"
      # --- FLFAC punishment ladder ---
      # - "25:0 kick %player% &cFLFAC &8» &fHitbox detected (%check_name%)"  # KICK
      # - "50:0 ban %player% FLFAC > Hitbox detected (%check_name%)"         # BAN

  Misc:
