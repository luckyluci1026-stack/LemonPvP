      - "1:1 [log]"
      - "5:3 [webhook]"
      - "5:3 [proxy]"
      # --- FLFAC punishment ladder (Reach is very reliable) ---
      # - "15:0 effect give %player% minecraft:slowness 9999 250 true"      # FREEZE
      # - "25:0 kick %player% &cFLFAC &8» &fReach detected (%check_name%)"   # KICK
      # - "50:0 ban %player% FLFAC > Reach detected (%check_name%)"          # BAN

  Hitboxes:
