      # - "60:0 kick %player% &cFLFAC &8» &fCombat anomaly (%check_name%)"   # KICK
      # - "120:0 ban %player% FLFAC > Combat anomaly (%check_name%)"         # BAN

  # As of 2.2.10, there are no AutoClicker checks and this is a placeholder.
  Autoclicker:
    remove-violations-after: 300
    checks:
      - "Autoclicker"
    commands:
      - "20:40 [alert]"
      - "1:1 [log]"
      # --- FLFAC punishment ladder ---
      # - "60:0 kick %player% &cFLFAC &8» &fAutoClicker (%check_name%)"      # KICK
