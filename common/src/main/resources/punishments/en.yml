# ======================================================================
#  BuckSMPAC - Punishments
# ======================================================================
# Placeholders:
#   %check_name%  - name of the check
#   %description% - description of the check
#   %vl%          - violations
#   %verbose%     - extra information
#   %player%      - player name
#
# Special commands:
#   [alert]   - notify staff in-game
#   [log]     - write to BuckSMPAC violation history
#   [webhook] - send to your Discord webhook
#   [proxy]   - broadcast to other servers via your proxy (Bungee/Velocity)
#
# Command format:  "Threshold:Interval Command"
#   N is the violation count required to run the command.
#   M > 0 -> runs at N, then N+M, N+2M, ...
#   M = 0 -> runs once when N is reached.
#   Examples:
#     "8:0 ban %player% cheating"      -> fires once on flag 8
#     "5:3 [alert]"                    -> fires on flags 5, 8, 11, 14, ...
#
# ----------------------------------------------------------------------
#  BANS ONLY, AND VERY STRICT
# ----------------------------------------------------------------------
# No kicks, no freezes. Every group below has exactly one punishment: a
# permanent ban, at a low threshold.
#
#   Reach        8   Knockback  15
#   Hitboxes     8   Combat     15
#   BadPackets  12   Misc       20
#   Post        12   Simulation 60
#
# Flags also linger twice as long as before (remove-violations-after: 600),
# so they accumulate towards the ban instead of cooling off.
#
# WHAT THAT MEANS: at these numbers a false positive is a permanent ban.
# Simulation is deliberately the loosest of the eight because it is the
# check that misfires most under lag, and it is the one to raise first if
# legitimate players start disappearing.
#
# Run with the alert lines only (comment out the BAN lines) for a few days
# and check that every player it names is actually cheating, before letting
# it ban anybody.
#
# ----------------------------------------------------------------------
#  BANMANAGER SETUP
# ----------------------------------------------------------------------
# These commands run on THIS backend server's console. BanManager on your
# proxy alone is not reachable from here - the command resolves to nothing
# and the player keeps playing. BuckSMPAC logs a warning when that happens,
# so check the console after the first ban.
#
# Install BanManager's Spigot/Paper build on this server too and point it at
# the SAME database as the proxy copy. BanManager documents that setup, and
# then the ban below is network-wide.
#
#   permanent (what ships):  "8:0 ban %player% <reason>"
#   timed instead:           "8:0 tempban %player% 30d <reason>"
#   also IP:                 "8:0 banip %player% <reason>"
# ----------------------------------------------------------------------

Punishments:
  Simulation:
    # After how many seconds should a violation be removed?
    remove-violations-after: 600
    checks:
      - "Simulation"
      - "GroundSpoof"
      - "Timer"
      - "TimerLimit"
      - "NoFall"
    commands:
      - "30:15 [alert]"
      - "1:1 [log]"
      - "100:100 [webhook]"
      - "100:100 [proxy]"
      # --- BuckSMPAC punishment ladder ---
      - "60:0 ban %player% BuckSMPAC > Cheating detected (%check_name%)"      # BAN

  Knockback:
    remove-violations-after: 600
    checks:
      - "Knockback"
      - "Explosion"
    commands:
      - "5:5 [alert]"
      - "1:1 [log]"
      - "20:20 [webhook]"
      - "20:20 [proxy]"
      # --- BuckSMPAC punishment ladder ---
      - "15:0 ban %player% BuckSMPAC > Anti-Knockback (%check_name%)"          # BAN

  Post:
    remove-violations-after: 600
    checks:
      - "Post"
    commands:
      - "8:8 [alert]"
      - "1:1 [log]"
      - "40:40 [webhook]"
      - "40:40 [proxy]"
      # --- BuckSMPAC punishment ladder (Post is very reliable) ---
      - "12:0 ban %player% BuckSMPAC > Packet order (%check_name%)"          # BAN

  BadPackets:
    remove-violations-after: 600
    checks:
      - "BadPackets"
      - "PacketOrder"
      - "Crash"
    commands:
      - "8:8 [alert]"
      - "1:1 [log]"
      - "40:40 [webhook]"
      - "40:40 [proxy]"
      # --- BuckSMPAC punishment ladder (BadPackets is very reliable) ---
      - "12:0 ban %player% BuckSMPAC > Illegal packets (%check_name%)"         # BAN

  Reach:
    remove-violations-after: 600
    checks:
      - "Reach"
    commands:
      - "5:3 [alert]"
      - "1:1 [log]"
      - "5:3 [webhook]"
      - "5:3 [proxy]"
      # --- BuckSMPAC punishment ladder (Reach is very reliable) ---
      - "8:0 ban %player% BuckSMPAC > Reach detected (%check_name%)"          # BAN

  Hitboxes:
    remove-violations-after: 600
    checks:
      - "Hitboxes"
    commands:
      - "5:3 [alert]"
      - "1:1 [log]"
      - "5:3 [webhook]"
      - "5:3 [proxy]"
      # --- BuckSMPAC punishment ladder ---
      - "8:0 ban %player% BuckSMPAC > Hitbox detected (%check_name%)"         # BAN

  Misc:
    remove-violations-after: 600
    checks:
      - "Vehicle"
      - "NoSlow"
      - "Sprint"
      - "MultiActions"
      - "Place"
      - "Baritone"
      - "Break"
      - "TransactionOrder"
      - "Elytra"
      - "Chat"
      - "Exploit"
    commands:
      - "5:3 [alert]"
      - "1:1 [log]"
      - "20:10 [webhook]"
      - "20:10 [proxy]"
      # --- BuckSMPAC punishment ladder ---
      - "20:0 ban %player% BuckSMPAC > Cheating detected (%check_name%)"      # BAN

  Combat:
    remove-violations-after: 600
    checks:
      - "Interact"
      - "Aim"
    commands:
      - "8:10 [alert]"
      - "1:1 [log]"
      # --- BuckSMPAC punishment ladder ---
      - "15:0 ban %player% BuckSMPAC > Combat anomaly (%check_name%)"         # BAN

  # BuckSMPAC's own AutoClicker check. It is marked experimental, and BuckSMPAC
  # ships with experimental-checks: true - so it IS running.
  #
  # DELIBERATELY ALERTS ONLY. Every other group here punishes a check that
  # upstream has years of field data on; this one is new code with none. Watch
  # the alerts on your own server first, confirm the players it names are
  # actually cheating, tune Autoclicker.max-attack-cps in config.yml to sit
  # above your fastest legitimate clicker, and only then uncomment the ladder
  # below. Enabling it untested will ban butterfly clickers.
  Autoclicker:
    remove-violations-after: 600
    checks:
      - "Autoclicker"
    commands:
      - "15:20 [alert]"
      - "1:1 [log]"
      # --- BuckSMPAC punishment ladder (enable only after tuning - see above) ---
      #- "120:0 ban %player% BuckSMPAC > AutoClicker (%check_name%)"           # BAN

# Bump marker — BuckSMPAC compares this against the version it ships and
# warns in the console when yours is older. This file is never overwritten
# automatically, so the warning is the only way you would find out.
punishments-version: 4
