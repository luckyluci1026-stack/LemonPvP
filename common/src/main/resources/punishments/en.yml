      - "Crash"
    commands:
      - "20:20 [alert]"
      - "1:1 [log]"
      - "40:40 [webhook]"
      - "40:40 [proxy]"
      # --- FLFAC punishment ladder (BadPackets is very reliable) ---
      # - "40:0 kick %player% &cFLFAC &8» &fIllegal packets (%check_name%)"  # KICK
      # - "80:0 ban %player% FLFAC > Illegal packets (%check_name%)"         # BAN

  Reach:
    remove-violations-after: 300
