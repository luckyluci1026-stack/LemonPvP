# ======================================================================
#  BuckSMPAC - Strafen
# ======================================================================
# Platzhalter:
#   %check_name%  - Name der Prüfung
#   %description% - Beschreibung der Prüfung
#   %vl%          - Verstöße
#   %verbose%     - zusätzliche Informationen
#   %player%      - Spielername
#
# Spezielle Befehle:
#   [alert]   - benachrichtigt das Team im Spiel
#   [log]     - schreibt in die BuckSMPAC-Verstoßhistorie
#   [webhook] - sendet an deinen Discord-Webhook
#   [proxy]   - sendet an andere Server über deinen Proxy (Bungee/Velocity)
#
# Befehlsformat:  "Schwelle:Intervall Befehl"
#   N = benötigte Verstöße, damit der Befehl ausgeführt wird.
#   M > 0 -> läuft bei N, dann N+M, N+2M, ...
#   M = 0 -> läuft einmalig bei N.
#
# ----------------------------------------------------------------------
#  NUR BANS — keine Kicks, keine Freezes
# ----------------------------------------------------------------------
# Jede Gruppe unten hat genau eine Strafe: einen permanenten Ban.
#
#   Reach       14   Knockback   25
#   Hitboxes    14   Combat      25
#   Post        20   Misc        32
#   BadPackets  20   Simulation 100
#
# Ein Flag zählt 450 Sekunden nach dem Vorfall nicht mehr mit. Ein Spieler
# muss also in einer Sitzung wiederholt auffallen, um einen Ban zu
# erreichen - vereinzelte Falsch-Positive über einen Abend verteilt kühlen
# ab, statt sich aufzusummieren.
#
# Simulation liegt bewusst weit über dem Rest: dieser Check greift unter
# Lag am ehesten daneben, und es ist die erste Zahl, die du hochsetzen
# solltest, wenn legitime Spieler verschwinden.
#
# TROTZDEM SINNVOLL: erst ein paar Tage mit auskommentierten BAN-Zeilen
# laufen lassen und prüfen, ob die Alerts wirklich Cheater nennen.
#
# ----------------------------------------------------------------------
#  /acban — BUCKSMPACS EIGENER BAN
# ----------------------------------------------------------------------
# Kein fremder Plugin-Befehl: nichts zu installieren, nichts zu
# konfigurieren, und er kann nicht ins Leere laufen, weil ein Ban-Plugin
# woanders liegt.
#
#   /acban <Spieler> [Grund]
#   /acunban <Spieler>
#
# Mit dem Velocity-Plugin wird der Ban am Proxy durchgesetzt - ein
# gebannter Spieler wird abgewiesen, bevor er irgendeinen Server erreicht.
# Ohne das Plugin gilt der Ban auf jedem Backend mit BuckSMPAC.
#
# Lieber ein externes Plugin? Dann acban durch dessen Befehl ersetzen:
#   "14:0 tempban %player% 30d BuckSMPAC > Cheating (%check_name%)"
# ----------------------------------------------------------------------

Punishments:
  Simulation:
    remove-violations-after: 450
    checks:
      - "Simulation"
      - "GroundSpoof"
      - "Timer"
      - "TimerLimit"
      - "NoFall"
    commands:
      - "40:20 [alert]"
      - "1:1 [log]"
      - "100:100 [webhook]"
      - "100:100 [proxy]"
      # --- BuckSMPAC Strafen-Leiter ---
      - "100:0 acban %player% BuckSMPAC > Cheating erkannt (%check_name%)"       # BAN

  Knockback:
    remove-violations-after: 450
    checks:
      - "Knockback"
      - "Explosion"
    commands:
      - "8:8 [alert]"
      - "1:1 [log]"
      - "20:20 [webhook]"
      - "20:20 [proxy]"
      # --- BuckSMPAC Strafen-Leiter ---
      - "25:0 acban %player% BuckSMPAC > Anti-Knockback (%check_name%)"          # BAN

  Post:
    remove-violations-after: 450
    checks:
      - "Post"
    commands:
      - "12:12 [alert]"
      - "1:1 [log]"
      - "40:40 [webhook]"
      - "40:40 [proxy]"
      # --- BuckSMPAC Strafen-Leiter (Post ist sehr zuverlässig) ---
      - "20:0 acban %player% BuckSMPAC > Paketreihenfolge (%check_name%)"        # BAN

  BadPackets:
    remove-violations-after: 450
    checks:
      - "BadPackets"
      - "PacketOrder"
      - "Crash"
    commands:
      - "12:12 [alert]"
      - "1:1 [log]"
      - "40:40 [webhook]"
      - "40:40 [proxy]"
      # --- BuckSMPAC Strafen-Leiter (BadPackets ist sehr zuverlässig) ---
      - "20:0 acban %player% BuckSMPAC > Illegale Pakete (%check_name%)"         # BAN

  Reach:
    remove-violations-after: 450
    checks:
      - "Reach"
    commands:
      - "6:4 [alert]"
      - "1:1 [log]"
      - "5:3 [webhook]"
      - "5:3 [proxy]"
      # --- BuckSMPAC Strafen-Leiter (Reach ist sehr zuverlässig) ---
      - "14:0 acban %player% BuckSMPAC > Reach erkannt (%check_name%)"           # BAN

  Hitboxes:
    remove-violations-after: 450
    checks:
      - "Hitboxes"
    commands:
      - "6:4 [alert]"
      - "1:1 [log]"
      - "5:3 [webhook]"
      - "5:3 [proxy]"
      # --- BuckSMPAC Strafen-Leiter ---
      - "14:0 acban %player% BuckSMPAC > Hitbox erkannt (%check_name%)"          # BAN

  Misc:
    remove-violations-after: 450
    checks:
      - "Vehicle"
      - "NoSlow"
      - "Sprint"
      - "MultiActions"
      - "Place"
      - "Baritone"
      - "Break"
      - "TransactionOrder"
      - "Elytra"
      - "Chat"
      - "Exploit"
    commands:
      - "8:5 [alert]"
      - "1:1 [log]"
      - "20:10 [webhook]"
      - "20:10 [proxy]"
      # --- BuckSMPAC Strafen-Leiter ---
      - "32:0 acban %player% BuckSMPAC > Cheating erkannt (%check_name%)"       # BAN

  Combat:
    remove-violations-after: 450
    checks:
      - "Interact"
      - "Aim"
    commands:
      - "12:15 [alert]"
      - "1:1 [log]"
      # --- BuckSMPAC Strafen-Leiter ---
      - "25:0 acban %player% BuckSMPAC > Kampf-Anomalie (%check_name%)"         # BAN

  # BuckSMPACs eigener AutoClicker-Check. Er ist als experimentell markiert,
  # und BuckSMPAC liefert experimental-checks: true aus - er LÄUFT also.
  #
  # BEWUSST NUR ALERTS. Hinter jeder anderen Gruppe hier steht ein Check, für
  # den es jahrelange Praxisdaten gibt - hinter diesem nicht. Erst die Alerts
  # auf dem eigenen Server beobachten, prüfen ob die genannten Spieler wirklich
  # cheaten, dann Autoclicker.max-attack-cps in der config.yml über den
  # schnellsten legitimen Klicker setzen - und erst danach die Leiter unten
  # einkommentieren. Ungetestet aktiviert bannt sie Butterfly-Clicker.
  Autoclicker:
    remove-violations-after: 450
    checks:
      - "Autoclicker"
    commands:
      - "15:20 [alert]"
      - "1:1 [log]"
      # --- BuckSMPAC Strafen-Leiter (erst nach dem Einstellen aktivieren) ---
      #- "120:0 acban %player% BuckSMPAC > AutoClicker (%check_name%)"           # BAN

# Bump marker — BuckSMPAC compares this against the version it ships and
# warns in the console when yours is older. This file is never overwritten
# automatically, so the warning is the only way you would find out.
punishments-version: 6
