# ======================================================================
#  BuckSMPAC - Strafen
# ======================================================================
# Platzhalter:
#   %check_name%  - Name der Prüfung
#   %description% - Beschreibung der Prüfung
#   %vl%          - Verstöße
#   %verbose%     - zusätzliche Informationen
#   %player%      - Spielername
#
# Spezielle Befehle:
#   [alert]   - benachrichtigt das Team im Spiel
#   [log]     - schreibt in die BuckSMPAC-Verstoßhistorie
#   [webhook] - sendet an deinen Discord-Webhook
#   [proxy]   - sendet an andere Server über deinen Proxy (Bungee/Velocity)
#
# Befehlsformat:  "Schwelle:Intervall Befehl"
#   N = benötigte Verstöße, damit der Befehl ausgeführt wird.
#   M > 0 -> läuft bei N, dann N+M, N+2M, ...
#   M = 0 -> läuft einmalig bei N.
#
# ----------------------------------------------------------------------
#  >>> BAN / KICK / FREEZE - so wählst du die Strafe <<<
# ----------------------------------------------------------------------
# Jede Gruppe hat einen "BuckSMPAC Strafen-Leiter"-Abschnitt. Zum AKTIVIEREN
# einer Strafe die Zeile entkommentieren (das "#" entfernen), zum
# DEAKTIVIEREN ein "#" davor setzen. Beliebig pro Gruppe kombinierbar.
#
#   FREEZE (Vanilla, ohne Zusatz-Plugin):
#     "40:0 effect give %player% minecraft:slowness 9999 250 true"
#     "40:0 effect give %player% minecraft:blindness 9999 1 true"
#   FREEZE (mit Freeze-Plugin, z. B. Befehl /freeze):
#     "40:0 freeze %player%"
#   KICK:
#     "60:0 kick %player% &cBuckSMPAC &8» &fUnfairer Vorteil erkannt (%check_name%)"
#   BAN (Vanilla):
#     "100:0 ban %player% BuckSMPAC > Cheating erkannt (%check_name%)"
#   BAN (mit LiteBans/AdvancedBan usw.):
#     "100:0 tempban %player% 30d BuckSMPAC > Cheating (%check_name%)"
# ======================================================================
# ----------------------------------------------------------------------
#  DIESE LEITER BANNT DIREKT - es gibt keine Kick-Stufe.
# ----------------------------------------------------------------------
# Jede Gruppe unten bannt sofort bei der Schwelle, die vorher nur gekickt
# hat. Ein Falsch-Positiv ist damit ein Ban, kein Kick - beobachte die
# Alerts also ein paar Tage, bevor du den Zahlen auf dem Live-Server traust.
#
# WICHTIG IM PROXY-NETZWERK: Vanilla-/ban bannt nur auf DIESEM Backend.
# Der Spieler kommt über Velocity weiterhin auf deine anderen Server. Für
# einen netzwerkweiten Ban ein proxy-fähiges Plugin nehmen und den Befehl
# tauschen:
#     "25:0 tempban %player% 30d BuckSMPAC > Cheating (%check_name%)"
# ----------------------------------------------------------------------

Punishments:
  Simulation:
    remove-violations-after: 300
    checks:
      - "Simulation"
      - "GroundSpoof"
      - "Timer"
      - "TimerLimit"
      - "NoFall"
    commands:
      - "60:30 [alert]"
      - "1:1 [log]"
      - "100:100 [webhook]"
      - "100:100 [proxy]"
      # --- BuckSMPAC Strafen-Leiter ---
      - "80:0 effect give %player% minecraft:slowness 9999 250 true"     # FREEZE
      - "120:0 ban %player% BuckSMPAC > Cheating erkannt (%check_name%)"       # BAN

  Knockback:
    remove-violations-after: 300
    checks:
      - "Knockback"
      - "Explosion"
    commands:
      - "5:5 [alert]"
      - "1:1 [log]"
      - "20:20 [webhook]"
      - "20:20 [proxy]"
      # --- BuckSMPAC Strafen-Leiter ---
      - "25:0 ban %player% BuckSMPAC > Anti-Knockback (%check_name%)"          # BAN

  Post:
    remove-violations-after: 300
    checks:
      - "Post"
    commands:
      - "15:15 [alert]"
      - "1:1 [log]"
      - "40:40 [webhook]"
      - "40:40 [proxy]"
      # --- BuckSMPAC Strafen-Leiter (Post ist sehr zuverlässig) ---
      - "25:0 ban %player% BuckSMPAC > Paketreihenfolge (%check_name%)"        # BAN

  BadPackets:
    remove-violations-after: 300
    checks:
      - "BadPackets"
      - "PacketOrder"
      - "Crash"
    commands:
      - "15:15 [alert]"
      - "1:1 [log]"
      - "40:40 [webhook]"
      - "40:40 [proxy]"
      # --- BuckSMPAC Strafen-Leiter (BadPackets ist sehr zuverlässig) ---
      - "25:0 ban %player% BuckSMPAC > Illegale Pakete (%check_name%)"         # BAN

  Reach:
    remove-violations-after: 300
    checks:
      - "Reach"
    commands:
      - "5:3 [alert]"
      - "1:1 [log]"
      - "5:3 [webhook]"
      - "5:3 [proxy]"
      # --- BuckSMPAC Strafen-Leiter (Reach ist sehr zuverlässig) ---
      - "10:0 effect give %player% minecraft:slowness 9999 250 true"      # FREEZE
      - "15:0 ban %player% BuckSMPAC > Reach erkannt (%check_name%)"           # BAN

  Hitboxes:
    remove-violations-after: 300
    checks:
      - "Hitboxes"
    commands:
      - "5:3 [alert]"
      - "1:1 [log]"
      - "5:3 [webhook]"
      - "5:3 [proxy]"
      # --- BuckSMPAC Strafen-Leiter ---
      - "15:0 ban %player% BuckSMPAC > Hitbox erkannt (%check_name%)"          # BAN

  Misc:
    remove-violations-after: 300
    checks:
      - "Vehicle"
      - "NoSlow"
      - "Sprint"
      - "MultiActions"
      - "Place"
      - "Baritone"
      - "Break"
      - "TransactionOrder"
      - "Elytra"
      - "Chat"
      - "Exploit"
    commands:
      - "8:4 [alert]"
      - "1:1 [log]"
      - "20:10 [webhook]"
      - "20:10 [proxy]"
      # --- BuckSMPAC Strafen-Leiter ---
      - "35:0 ban %player% BuckSMPAC > Cheating erkannt (%check_name%)"       # BAN

  Combat:
    remove-violations-after: 300
    checks:
      - "Interact"
      - "Aim"
    commands:
      - "15:20 [alert]"
      - "1:1 [log]"
      # --- BuckSMPAC Strafen-Leiter ---
      - "35:0 ban %player% BuckSMPAC > Kampf-Anomalie (%check_name%)"         # BAN

  # BuckSMPACs eigener AutoClicker-Check. Er ist als experimentell markiert,
  # und BuckSMPAC liefert experimental-checks: true aus - er LÄUFT also.
  #
  # BEWUSST NUR ALERTS. Hinter jeder anderen Gruppe hier steht ein Check, für
  # den es jahrelange Praxisdaten gibt - hinter diesem nicht. Erst die Alerts
  # auf dem eigenen Server beobachten, prüfen ob die genannten Spieler wirklich
  # cheaten, dann Autoclicker.max-attack-cps in der config.yml über den
  # schnellsten legitimen Klicker setzen - und erst danach die Leiter unten
  # einkommentieren. Ungetestet aktiviert bannt sie Butterfly-Clicker.
  Autoclicker:
    remove-violations-after: 300
    checks:
      - "Autoclicker"
    commands:
      - "15:20 [alert]"
      - "1:1 [log]"
      # --- BuckSMPAC Strafen-Leiter (erst nach dem Einstellen aktivieren) ---
      #- "60:0 kick %player% &cBuckSMPAC &8» &fAutoClicker (%check_name%)"     # KICK
      #- "120:0 ban %player% BuckSMPAC > AutoClicker (%check_name%)"           # BAN

# Bump marker — BuckSMPAC compares this against the version it ships and
# warns in the console when yours is older. This file is never overwritten
# automatically, so the warning is the only way you would find out.
punishments-version: 2
