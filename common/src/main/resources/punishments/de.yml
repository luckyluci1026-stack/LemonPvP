# ======================================================================
#  BuckSMPAC - Strafen
# ======================================================================
# Platzhalter:
#   %check_name%  - Name der Prüfung
#   %description% - Beschreibung der Prüfung
#   %vl%          - Verstöße
#   %verbose%     - zusätzliche Informationen
#   %player%      - Spielername
#
# Spezielle Befehle:
#   [alert]   - benachrichtigt das Team im Spiel
#   [log]     - schreibt in die BuckSMPAC-Verstoßhistorie
#   [webhook] - sendet an deinen Discord-Webhook
#   [proxy]   - sendet an andere Server über deinen Proxy (Bungee/Velocity)
#
# Befehlsformat:  "Schwelle:Intervall Befehl"
#   N = benötigte Verstöße, damit der Befehl ausgeführt wird.
#   M > 0 -> läuft bei N, dann N+M, N+2M, ...
#   M = 0 -> läuft einmalig bei N.
#
# ----------------------------------------------------------------------
#  NUR BANS, UND SEHR STRENG
# ----------------------------------------------------------------------
# Keine Kicks, keine Freezes. Jede Gruppe unten hat genau eine Strafe:
# einen permanenten Ban, bei einer niedrigen Schwelle.
#
#   Reach        8   Knockback  15
#   Hitboxes     8   Combat     15
#   BadPackets  12   Misc       20
#   Post        12   Simulation 60
#
# Flags bleiben außerdem doppelt so lange liegen wie vorher
# (remove-violations-after: 600), sammeln sich also Richtung Ban statt
# abzukühlen.
#
# WAS DAS BEDEUTET: Bei diesen Zahlen ist ein Falsch-Positiv ein
# permanenter Ban. Simulation ist bewusst die locker­ste der acht Gruppen,
# weil dieser Check unter Lag am ehesten daneben greift - und es ist die
# erste Zahl, die du hochsetzen solltest, wenn legitime Spieler
# verschwinden.
#
# Lass es erst ein paar Tage nur mit den Alert-Zeilen laufen (BAN-Zeilen
# auskommentieren) und prüfe, ob jeder genannte Spieler wirklich cheatet,
# bevor du es bannen lässt.
#
# ----------------------------------------------------------------------
#  BANMANAGER-SETUP
# ----------------------------------------------------------------------
# Diese Befehle laufen auf der Konsole DIESES Backend-Servers. BanManager
# nur auf dem Proxy ist von hier nicht erreichbar - der Befehl läuft ins
# Leere und der Spieler spielt weiter. BuckSMPAC schreibt dann eine
# Warnung, also nach dem ersten Ban in die Konsole schauen.
#
# Installier BanManagers Spigot/Paper-Build zusätzlich auf diesem Server
# und zeig es auf DIESELBE Datenbank wie die Proxy-Installation.
# BanManager dokumentiert genau diesen Betrieb, dann ist der Ban unten
# netzwerkweit.
#
#   permanent (ausgeliefert): "8:0 ban %player% <Grund>"
#   stattdessen zeitlich:     "8:0 tempban %player% 30d <Grund>"
#   zusätzlich IP:            "8:0 banip %player% <Grund>"
# ----------------------------------------------------------------------

Punishments:
  Simulation:
    remove-violations-after: 600
    checks:
      - "Simulation"
      - "GroundSpoof"
      - "Timer"
      - "TimerLimit"
      - "NoFall"
    commands:
      - "30:15 [alert]"
      - "1:1 [log]"
      - "100:100 [webhook]"
      - "100:100 [proxy]"
      # --- BuckSMPAC Strafen-Leiter ---
      - "60:0 ban %player% BuckSMPAC > Cheating erkannt (%check_name%)"       # BAN

  Knockback:
    remove-violations-after: 600
    checks:
      - "Knockback"
      - "Explosion"
    commands:
      - "5:5 [alert]"
      - "1:1 [log]"
      - "20:20 [webhook]"
      - "20:20 [proxy]"
      # --- BuckSMPAC Strafen-Leiter ---
      - "15:0 ban %player% BuckSMPAC > Anti-Knockback (%check_name%)"          # BAN

  Post:
    remove-violations-after: 600
    checks:
      - "Post"
    commands:
      - "8:8 [alert]"
      - "1:1 [log]"
      - "40:40 [webhook]"
      - "40:40 [proxy]"
      # --- BuckSMPAC Strafen-Leiter (Post ist sehr zuverlässig) ---
      - "12:0 ban %player% BuckSMPAC > Paketreihenfolge (%check_name%)"        # BAN

  BadPackets:
    remove-violations-after: 600
    checks:
      - "BadPackets"
      - "PacketOrder"
      - "Crash"
    commands:
      - "8:8 [alert]"
      - "1:1 [log]"
      - "40:40 [webhook]"
      - "40:40 [proxy]"
      # --- BuckSMPAC Strafen-Leiter (BadPackets ist sehr zuverlässig) ---
      - "12:0 ban %player% BuckSMPAC > Illegale Pakete (%check_name%)"         # BAN

  Reach:
    remove-violations-after: 600
    checks:
      - "Reach"
    commands:
      - "5:3 [alert]"
      - "1:1 [log]"
      - "5:3 [webhook]"
      - "5:3 [proxy]"
      # --- BuckSMPAC Strafen-Leiter (Reach ist sehr zuverlässig) ---
      - "8:0 ban %player% BuckSMPAC > Reach erkannt (%check_name%)"           # BAN

  Hitboxes:
    remove-violations-after: 600
    checks:
      - "Hitboxes"
    commands:
      - "5:3 [alert]"
      - "1:1 [log]"
      - "5:3 [webhook]"
      - "5:3 [proxy]"
      # --- BuckSMPAC Strafen-Leiter ---
      - "8:0 ban %player% BuckSMPAC > Hitbox erkannt (%check_name%)"          # BAN

  Misc:
    remove-violations-after: 600
    checks:
      - "Vehicle"
      - "NoSlow"
      - "Sprint"
      - "MultiActions"
      - "Place"
      - "Baritone"
      - "Break"
      - "TransactionOrder"
      - "Elytra"
      - "Chat"
      - "Exploit"
    commands:
      - "5:3 [alert]"
      - "1:1 [log]"
      - "20:10 [webhook]"
      - "20:10 [proxy]"
      # --- BuckSMPAC Strafen-Leiter ---
      - "20:0 ban %player% BuckSMPAC > Cheating erkannt (%check_name%)"       # BAN

  Combat:
    remove-violations-after: 600
    checks:
      - "Interact"
      - "Aim"
    commands:
      - "8:10 [alert]"
      - "1:1 [log]"
      # --- BuckSMPAC Strafen-Leiter ---
      - "15:0 ban %player% BuckSMPAC > Kampf-Anomalie (%check_name%)"         # BAN

  # BuckSMPACs eigener AutoClicker-Check. Er ist als experimentell markiert,
  # und BuckSMPAC liefert experimental-checks: true aus - er LÄUFT also.
  #
  # BEWUSST NUR ALERTS. Hinter jeder anderen Gruppe hier steht ein Check, für
  # den es jahrelange Praxisdaten gibt - hinter diesem nicht. Erst die Alerts
  # auf dem eigenen Server beobachten, prüfen ob die genannten Spieler wirklich
  # cheaten, dann Autoclicker.max-attack-cps in der config.yml über den
  # schnellsten legitimen Klicker setzen - und erst danach die Leiter unten
  # einkommentieren. Ungetestet aktiviert bannt sie Butterfly-Clicker.
  Autoclicker:
    remove-violations-after: 600
    checks:
      - "Autoclicker"
    commands:
      - "15:20 [alert]"
      - "1:1 [log]"
      # --- BuckSMPAC Strafen-Leiter (erst nach dem Einstellen aktivieren) ---
      #- "120:0 ban %player% BuckSMPAC > AutoClicker (%check_name%)"           # BAN

# Bump marker — BuckSMPAC compares this against the version it ships and
# warns in the console when yours is older. This file is never overwritten
# automatically, so the warning is the only way you would find out.
punishments-version: 4
