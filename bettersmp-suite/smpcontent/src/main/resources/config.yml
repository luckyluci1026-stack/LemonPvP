# ==========================================================
#  HINWEIS zu den Möbeln
#
#  Die Beine der Originalmodelle stehen leicht schräg (5°,
#  auf zwei Achsen gleichzeitig). Minecraft erlaubt in
#  Blockmodellen nur EINE Drehachse pro Element und nur die
#  Winkel -45 / -22.5 / 0 / 22.5 / 45. Die 5°-Neigung ist
#  damit nicht darstellbar - die Beine stehen jetzt gerade.
#  Das ist die einzige sichtbare Abweichung vom Original.
#
#  workbench ist 32 Einheiten breit, easel gut zwei Blöcke
#  hoch. Beide ragen über ihren Block hinaus - das geht in
#  Minecraft, sieht aber komisch aus, wenn direkt daneben
#  ein anderer Block steht.
# ==========================================================
# ----------------------------------------------------------
#  Eigene Items
#  material = das Basis-Item (bestimmt Verhalten & Bedrock-Aussehen)
#  model-data = muss zum Geyser-Mapping passen
#
#  EINRÜCKUNG: Der Name des Items steht mit GENAU 2 Leerzeichen,
#  seine Eigenschaften mit 4. Keine Tabs. So sieht es richtig aus:
#
#  items:
#  ..mein_item:            <- 2 Leerzeichen
#  ....material: STICK     <- 4 Leerzeichen
#
#  Ein Leerzeichen zu viel und die ganze Datei lässt sich nicht mehr
#  lesen. /smpcontent reload sagt dir dann Zeile und Grund.
# ----------------------------------------------------------
