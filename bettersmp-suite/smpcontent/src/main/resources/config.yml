    name: "<red>Rubinerz</red>"
    lore: ["<dark_gray>Eigener Block", "<gray>Gibt 1-2 Rubine"]
    state: "minecraft:note_block[instrument=bit,note=1,powered=false]"
    # Was beim Abbauen faellt. Ohne diesen Abschnitt faellt der Block selbst.
    # Behutsamkeit gibt immer den Block, Gluecksbringer erhoeht die Menge.
    drops:
      - item: "smp:ruby"
        amount: 1-2
    experience: 3
    recipe:
