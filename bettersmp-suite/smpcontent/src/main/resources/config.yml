# ==========================================================
#  Waffen & Werkzeuge - mögliche Zusatzfelder pro Item
# ==========================================================
#  attributes:          Vanilla-Attributnamen -> Wert
#                       attack_damage, attack_speed, max_health,
#                       movement_speed, armor, armor_toughness,
#                       knockback_resistance, luck ...
#                       (attack_speed ist negativ = langsamer)
#  durability: 2000     eigene Haltbarkeit
#  unbreakable: true    nutzt sich nie ab
#  enchants:            Verzauberung -> Stufe (sharpness, efficiency,
#                       unbreaking, fortune, protection ...)
#  glow: true           Leucht-Effekt ohne echte Verzauberung
#
#  Eigene 3D-Modelle aus Blockbench:
#    plugins/SMPContent/models/item/<id>.json
#    plugins/SMPContent/models/block/<id>.json
#  Texturen:
#    plugins/SMPContent/textures/item/<id>.png
#    plugins/SMPContent/textures/block/<id>.png
#  Danach:  /smpcontent pack
