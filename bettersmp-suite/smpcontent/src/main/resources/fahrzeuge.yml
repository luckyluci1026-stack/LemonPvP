# ==========================================================
#  Fahrzeuge - Autos, Jets und Züge
#
#  So funktioniert es im Spiel:
#    Rechtsklick mit dem Fahrzeug-Item auf den Boden  ->  hinstellen
#    Rechtsklick auf das Fahrzeug                     ->  einsteigen
#    Schleichen + Rechtsklick mit leerer Hand         ->  wieder einpacken
#    Schleichen im Fahrzeug                           ->  aussteigen
#
#  Gefahren wird mit den ganz normalen Bewegungstasten:
#    Auto   W Gas, S Bremse/rückwärts, A und D lenken
#    Jet    W Schub, Leertaste steigen, Schleichen sinken
#    Zug    W fährt los - der Rest macht die Schiene
#
#  "item" ist die Id aus deiner config.yml, mit der man das
#  Fahrzeug hinstellt. "model" ist die Id, deren Modell als
#  Karosserie gezeigt wird - meistens dasselbe Item.
#
#  Werte:
#    art     auto | jet | zug | boot
#    speed   Höchstgeschwindigkeit in Blöcken pro Tick
#            (0.55 ist ungefähr Sprinttempo mal zwei)
#    power   wie schnell es beschleunigt
#    turn    Grad pro Tick beim Lenken
#    seats   wie viele mitfahren (Fahrer eingerechnet)
#    scale   Größe des Modells
#    fuel    Item, das als Sprit verbraucht wird (leer = keins)
#    range   wie viele Ticks ein Stück Sprit reicht
#
#  Schleudersitz und Absturz
#
#  eject:  zweimal schnell schleichen -> es schiesst dich raus,
#          darueber geht der Fallschirm auf. Im Flug kann man
#          nicht mehr einfach aussteigen, sonst waere der erste
#          Schleicher schon der Absprung.
#    window       wie schnell die zwei Schleicher kommen muessen (Sekunden)
#    power        wie hoch es dich schleudert
#    forward      wieviel davon nach vorne geht
#    parachute    Id deines Fallschirm-Items (leer = kein Schirm)
#    open-after   Ticks, bis der Schirm aufgeht
#    fall-speed   wie schnell man am Schirm sinkt
#    drift        wie gut man am Schirm lenken kann
#
#  crash:  gegen eine Wand fahren tut weh
#    min-speed    ab welchem Tempo es kracht
#    damage       Schaden fuer alle Insassen
#    explosion    Staerke (0 = keine)
#    break-blocks ob die Explosion Bloecke zerstoert
#    destroy      ob das Fahrzeug dabei kaputtgeht
#    ram          Schaden fuer den, den du umfaehrst (0 = niemand)
#    hard-landing ab welcher Sinkgeschwindigkeit ein Flieger beim
#                 Aufsetzen zu Bruch geht (0 = nie)
#
#  horn: <Ton>  hupt auf der Leertaste (nicht bei Fliegern)
#
#  rotor: 1.3 haengt ein drehendes Rotorblatt darueber
#             (Hubschrauber). 0 = keins.
#
#  hud: true  zeigt Tempo, Hoehe und Sprit ueber der Hotbar. Angezeigt
#             wird die WIRKLICH gefahrene Strecke, nicht der
#             eingestellte Wert - so siehst du beim Einstellen sofort,
#             ob eine Zahl haelt, was sie verspricht.
#
# ==========================================================

