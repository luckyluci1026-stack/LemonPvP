  # ------------------------------------------------------------------
  #  Flugzeuge und Jets
  #
  #  Gesteuert wird mit dem Kopf: Wohin du schaust, da geht die Nase hin.
  #  Nach oben ziehen steigt, nach unten druecken ist Sturzflug - wie
  #  stark, haengt vom Schub ab. Leertaste und Schleichen heben und
  #  senken zusaetzlich gerade, das brauchst du zum Landen.
  #
  #    hover: false   sackt ohne Schub langsam durch  (Flugzeug)
  #    hover: true    bleibt ohne Schub stehen        (Hubschrauber)
  # ------------------------------------------------------------------

  rennjet:
    art: jet
    item: jet_renn
    model: jet_renn
