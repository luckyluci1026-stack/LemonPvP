# ==========================================================
#  Fahrzeuge - Autos, Jets und Züge
#
#  So funktioniert es im Spiel:
#    Rechtsklick mit dem Fahrzeug-Item auf den Boden  ->  hinstellen
#    Rechtsklick auf das Fahrzeug                     ->  einsteigen
#    Schleichen + Rechtsklick mit leerer Hand         ->  wieder einpacken
#    Schleichen im Fahrzeug                           ->  aussteigen
#
#  Gefahren wird mit den ganz normalen Bewegungstasten:
#    Auto   W Gas, S Bremse/rückwärts, A und D lenken
#    Jet    W Schub, Leertaste steigen, Schleichen sinken
#    Zug    W fährt los - der Rest macht die Schiene
#
#  "item" ist die Id aus deiner config.yml, mit der man das
#  Fahrzeug hinstellt. "model" ist die Id, deren Modell als
#  Karosserie gezeigt wird - meistens dasselbe Item.
#
#  Werte:
#    art     auto | jet | zug
#    speed   Höchstgeschwindigkeit in Blöcken pro Tick
#            (0.55 ist ungefähr Sprinttempo mal zwei)
#    power   wie schnell es beschleunigt
#    turn    Grad pro Tick beim Lenken
#    seats   wie viele mitfahren (Fahrer eingerechnet)
#    scale   Größe des Modells
#    fuel    Item, das als Sprit verbraucht wird (leer = keins)
#    range   wie viele Ticks ein Stück Sprit reicht
# ==========================================================

vehicles:

  sportwagen:
    art: auto
    item: auto_sport
    model: auto_sport
    speed: 0.85
    power: 0.05
    turn: 5.0
    seats: 2
    scale: 1.0
    width: 1.8
    height: 1.3
    sound: entity.minecart.riding
    fuel: ""
    range: 600

  gelaendewagen:
    art: auto
    item: auto_gelaende
    model: auto_gelaende
    speed: 0.55
    power: 0.04
    turn: 4.0
    seats: 4
    scale: 1.1
    width: 2.0
    height: 1.6
    sound: entity.minecart.riding
    fuel: ""
    range: 600

  rennjet:
    art: jet
    item: jet_renn
    model: jet_renn
    speed: 1.4
    power: 0.06
    turn: 3.0
    seats: 1
    scale: 1.2
    width: 2.4
    height: 1.4
    sound: entity.phantom.flap
    fuel: ""
    range: 900

  dampflok:
    art: zug
    item: zug_lok
    model: zug_lok
    speed: 0.45
    power: 0.02
    turn: 0.0
    seats: 2
    scale: 1.2
    width: 1.6
    height: 2.0
    sound: entity.minecart.riding
    fuel: ""
    range: 1200
