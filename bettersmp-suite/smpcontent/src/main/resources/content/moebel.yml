# ==========================================================
#  50 Möbel
#
#  Alles eigene Blöcke (Notenblock-Zustände). Ohne Textur im
#  Pack sehen sie aus wie ein Notenblock - Modell dazulegen und
#  /smpcontent pack, dann sitzen sie.
#
#  Texturen erwartet unter:
#    plugins/SMPContent/textures/block/<id>.png
#  Eigene 3D-Modelle (Blockbench) unter:
#    plugins/SMPContent/models/block/<id>.json
#
#  Möbel brauchen kein Werkzeug und geben sich selbst zurück.
# ==========================================================

