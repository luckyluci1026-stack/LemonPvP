# ==========================================================
#  150 Platzhalter-Items - noch ohne Textur
#
#  Jedes Item gibt es sofort: /smpcontent give <Spieler> custom_item_001
#  Ohne Textur sieht es aus wie sein "material" (hier Papier).
#
#  So machst du eines davon zu deinem Item:
#    1. material auf das passende Basis-Item setzen
#       (IRON_SWORD für Waffen, IRON_PICKAXE für Werkzeuge,
#        PAPER/STICK/... für alles andere)
#    2. name/lore anpassen (Id gerne umbenennen)
#    3. Textur nach plugins/SMPContent/textures/item/<id>.png
#       (optional Blockbench-Modell nach models/item/<id>.json)
#    4. /smpcontent reload   und   /smpcontent pack
#
#  model-data muss eindeutig bleiben - die Zahlen hier sind frei.
#
#  Werte und Fähigkeiten wie bei den Laserschwertern:
#    attributes:, durability:, enchants:, glow:, abilities:
#  Alle Möglichkeiten stehen in FAEHIGKEITEN.txt.
# ==========================================================

