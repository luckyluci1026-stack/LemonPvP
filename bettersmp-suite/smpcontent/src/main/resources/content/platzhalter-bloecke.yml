# ==========================================================
#  100 Platzhalter-Blöcke - noch ohne Textur
#
#  Jeder Block funktioniert sofort: setzen, abbauen, Rezept.
#  Ohne Textur sieht er aus wie ein normaler Notenblock.
#
#  So machst du einen davon zu deinem Block:
#    1. name/lore hier anpassen (Id gerne umbenennen)
#    2. Textur nach plugins/SMPContent/textures/block/<id>.png
#       (optional Blockbench-Modell nach models/block/<id>.json)
#    3. /smpcontent reload   und   /smpcontent pack
#
#  Der "state" ist die Kennung des Blocks - jeder Wert darf nur
#  EINMAL vorkommen. Am besten so lassen, wie er ist.
#
#  Rezepte kannst du wie bei den fertigen Blöcken ergänzen:
#    recipe:
#      shape: ["SSS", "SRS", "SSS"]
#      keys: {S: STONE, R: DIAMOND}
#      amount: 1
# ==========================================================

