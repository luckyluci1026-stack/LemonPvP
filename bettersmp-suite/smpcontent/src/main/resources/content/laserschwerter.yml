# ==========================================================
#  Laserschwerter, Handy und Stock
#
#  Diese Datei wird beim ersten Start angelegt. Du kannst sie
#  frei ändern - /smpcontent reload liest sie neu ein.
#
#  EINRÜCKUNG: Item-Name = 2 Leerzeichen, Eigenschaften = 4.
# ==========================================================

items:

  laserschwert:
    material: IRON_SWORD
    name: "<red>Laserschwert</red>"
    lore:
      - "<dark_gray>Summt leise"
      - "<gray>Rechtsklick: <white>Laserstrahl</white>"
    model-data: 8111
    attributes:
      attack_damage: 9.0
      attack_speed: -2.0
    durability: 2400
    unbreakable: true
    glow: true
    abilities:
      # Rechtsklick: Strahl nach vorne, trifft alles auf der Linie
      - trigger: right-click
        name: "Laserstrahl"
        cooldown: 6
        actions:
          - type: animation
            shape: beam
            particle: DUST
            color: "#FF3B30"
            size: 1.1
            length: 14
            ticks: 8
          - type: sound
            sound: entity.blaze.shoot
            pitch: 1.6
          - type: damage-beam
            amount: 6.0
            range: 14
          - type: ignite
            seconds: 3
            target: victim

      # Beim Treffen: kurzer Funkenschlag
      - trigger: hit
        actions:
          - type: animation
            shape: slash
            particle: DUST
            color: "#FF3B30"
            size: 0.9
            radius: 1.4
            ticks: 4
          - type: sound
            sound: entity.player.attack_sweep
            pitch: 1.8

