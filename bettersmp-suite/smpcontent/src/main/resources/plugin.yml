name: SMPContent
version: ${project.version}
main: de.lemonpvp.smpcontent.SMPContent
api-version: '1.21'
authors: [SMP]
description: Eigene Blöcke und Items passend zum SMP-Texturepack.

commands:
  smpcontent:
    description: Verwaltung der eigenen Blöcke und Items
    usage: "/smpcontent <give|list|pack|bedrock|boss|reload>"
    aliases: [content, smpc]
    permission: smpcontent.admin

permissions:
  smpcontent.admin:
    description: Darf /smpcontent nutzen
    default: op
  smpcontent.place:
    description: Darf eigene Blöcke platzieren
    default: true
