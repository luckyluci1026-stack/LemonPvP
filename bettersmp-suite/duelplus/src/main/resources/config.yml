# ==========================================================
#  DuelPlus - Duell-System mit echtem SMP-Loot
#
#  EIN Plugin, installiert auf SMP, Lobby UND dem Duels-Server.
#  server-name und ist-arena-server unten steuern, wie es sich auf
#  DIESEM konkreten Server verhaelt - auf jedem Server eine eigene,
#  passende config.yml.
#
#  Braucht zwingend eine gemeinsame MariaDB (siehe database unten) -
#  ohne die kann kein Spielerinventar zwischen den Servern wandern.
#  Laeuft bereits eine fuer BetterSMP (dessen config.yml,
#  database.mariadb), einfach dieselben Zugangsdaten eintragen -
#  DuelPlus legt eigene Tabellen an, ohne BetterSMPs zu beruehren.
# ==========================================================

# Muss GENAU dem Namen entsprechen, unter dem DIESER Server in der
# velocity.toml unter [servers] steht (z.B. "SMP", "Lobby", "Duels").
server-name: "SMP"

# true NUR auf dem Duels-Server - dort werden die Arenen erzeugt und
# die eigentlichen Kaempfe verwaltet. Auf SMP und Lobby: false.
ist-arena-server: false

# true NUR auf dem SMP-Server (dem Server mit dem "echten" Loot) - dort
# wird das Inventar laufend in die Datenbank gespiegelt, damit eine
# Herausforderung von einem ANDEREN Server aus (z.B. der Lobby)
# tatsaechlich das SMP-Inventar mitschickt, statt des dortigen, meist
# leeren/anderen Live-Inventars. Auf Lobby und Duels: false.
ist-loot-quelle: false

# Wohin herausgeforderte Duelle geschickt werden - muss in der
# velocity.toml unter [servers] genauso heissen wie dort eingetragen.
arena-server-name: "Duels"

# ----------------------------------------------------------
#  Datenbank - siehe Hinweis oben, kein Betrieb ohne MariaDB moeglich.
# ----------------------------------------------------------
database:
  host: "127.0.0.1"
  port: 3306
  database: "bettersmp"
  user: "root"
  password: ""
  properties: "useUnicode=true&characterEncoding=utf8"

# ----------------------------------------------------------
#  Herausforderungen (/duel <Spieler>)
# ----------------------------------------------------------
anfrage:
  # Sekunden, bis eine unbeantwortete Herausforderung von selbst verfaellt
  timeout-sekunden: 60
  # Wie oft (in Ticks) ueber alle Server hinweg nach neuen bzw.
  # beantworteten Anfragen geschaut wird. 20 Ticks = 1 Sekunde.
  poll-takt: 20

# ----------------------------------------------------------
#  Gegenstand am Spawn
#
#  Wird nur auf Servern mit ist-arena-server: false ueberhaupt
#  beruecksichtigt (SMP, Lobby). Standardmaessig AUS - /duel <Spieler>
#  funktioniert ohnehin ueberall, unabhaengig davon; der Gegenstand ist
#  nur eine Zusatz-Moeglichkeit. Empfehlung: nur in der Lobby auf
#  "true" stellen (dort passt ein Menue-Gegenstand thematisch, genau
#  wie SMPLobbys eigene Kompass/Buch-Gegenstaende), auf dem SMP-Server
#  aus lassen - dort wirkt ein zusaetzliches Schwert im Inventar eher
#  störend als hilfreich.
# ----------------------------------------------------------
gegenstand:
  aktiv: false
  slot: 1
  material: IRON_SWORD
  name: "<gradient:#FF6B6B:#C92A2A><bold>Duell</bold></gradient>"
  beschreibung:
    - "<gray>Rechtsklick fordert jemanden heraus</gray>"
  # Beim Beitreten neu ins Inventar legen
  beim-ankommen: true

# ----------------------------------------------------------
#  Arenen - nur auf dem Duels-Server (ist-arena-server: true) relevant.
#  Jede Arena ist eine EIGENE, beim ersten Start automatisch erzeugte
#  Welt OHNE echte Vanilla-Terraingenerierung (kein Blick auf "die
#  echte Welt" am Rand), mit einer flachen, ebenfalls automatisch
#  gebauten dekorierten Plattform als fairer Kampfboden (rohes,
#  unbearbeitetes Vanilla-Gelaende waere fuer die zwei Duellanten
#  unterschiedlich fair je nach Landeplatz). Kein manuelles Bauen
#  noetig. Block-Aenderungen sind waehrend des Duells erlaubt, werden
#  aber danach komplett zurueckgerollt (siehe RollbackTracker).
#  Unter der Plattform folgt echtes, grabbares Terrain (Erde -> Stein ->
#  Tiefenschiefer) luecken-los bis zum unzerstoerbaren Bedrock hinunter -
#  reisst eine Explosion (Endkristall/Anker) den Boden weg, faellt man in
#  dieses Terrain statt in einen leeren Abgrund (siehe ArenaManager).
#  Reihum 2 verschiedene Materialpaletten (Stein, Tiefenschiefer),
#  gleicher Aufbau (zwei Ringe + feine Schachbrett-Textur + Speichen).
# ----------------------------------------------------------
arenen:
  anzahl: 4
  welt-praefix: "duell_arena_"
  # Radius der flachen Arena-Plattform UND der Worldborder darum -
  # beides zusammen ergibt die komplette begehbare Flaeche. Bei diesem
  # Standardwert (115) bleiben pro Arena dauerhaft ca. 256 Chunks
  # geladen (siehe ArenaManager.chunksLaden) - bei 4 Arenen also ueber
  # 1000 insgesamt. Auf schwacher Hardware ggf. kleiner waehlen.
  worldborder-groesse: 115
  # Wie weit die zwei Startpunkte innerhalb einer Arena auseinander liegen
  spawn-abstand: 20
  # Terrain-Aufbau UNTER der Plattform, von oben nach unten, OHNE Luecke
  # bis zum Bedrock (Y=-64, beim Flachwelt-Generator fest am Minimum der
  # Welt und nicht verschiebbar). Die Plattform-Hoehe selbst ist KEIN
  # eigener Wert mehr, sondern ergibt sich rechnerisch aus diesen drei
  # Tiefen (siehe ArenaManager.terrainHoeheBerechnen) - bei den
  # Standardwerten unten liegt sie bei Y=-6. Aendert man diese Werte
  # nachtraeglich, wirkt das erst nach dem Loeschen der Arena-Weltordner
  # (siehe README).
  boden-tiefe: 7
  stein-tiefe: 35
  deepslate-tiefe: 15
  # Erst SO WEIT unter dem Bedrock (Y=-64) zaehlt ein Sturz noch als
  # automatische Niederlage - im Normalfall voellig unerreichbar (Bedrock
  # ist unzerstoerbar, eine unsichtbare Barriere-Box haelt seitlich
  # dicht), rein ein Sicherheitsnetz gegen Bugs/Luecken. Reisst eine
  # Explosion die Plattform weg, faellt man in echtes Gestein statt in
  # diese Todeslinie.
  todeslinie-y: -100

# ----------------------------------------------------------
#  Ablauf eines Duells
# ----------------------------------------------------------
kampf:
  countdown-sekunden: 5
  # Sekunden, die die Todeskamera nach einer Niederlage laeuft, bevor
  # es zurueck auf den Herkunftsserver geht
  todeskamera-sekunden: 5
  # Sobald der Kampf beginnt, schrumpft die Worldborder von der vollen
  # Arena-Groesse auf ziel-groesse - zwingt beide nach und nach
  # zueinander, verhindert endloses Ausweichen/Verstecken am Rand. Das
  # Tempo passt sich dabei laufend an: solange getroffen wird, laeuft es
  # im normalen (langsamen) Tempo (dauer-sekunden) - campen beide nur
  # und es faellt laenger als camping-nach-sekunden kein Treffer, wird
  # auf das schnellere Camping-Tempo (camping-dauer-sekunden) umgestellt.
  worldborder-schrumpfen:
    ziel-groesse: 10
    dauer-sekunden: 270
    camping-nach-sekunden: 15
    camping-dauer-sekunden: 60
  # Faellt waehrend des Kampfes laenger als warnung-nach-minuten kein
  # Treffer, warnt eine Chat-Nachricht beide Duellanten vor: faellt
  # danach nochmal frist-danach-minuten lang kein Treffer, wird die
  # Runde automatisch aufgegeben - OHNE Sieger, aber beide verlieren
  # inventar-verlust-anteil ihres Inventars (zufaellig ausgewaehlte,
  # belegte Faecher aus Hauptinventar+Ruestung+Offhand zusammen,
  # ersatzlos - kein Loot fuer den jeweils anderen). JEDER Treffer
  # setzt die Uhr komplett zurueck, egal wie weit sie schon gelaufen
  # war - ein Duell mit normalem Kampf ist davon nie betroffen.
  aufgabe-bei-inaktivitaet:
    aktiv: true
    warnung-nach-minuten: 10
    frist-danach-minuten: 5
    inventar-verlust-anteil: 0.2

# ----------------------------------------------------------
#  Loot
# ----------------------------------------------------------
loot:
  # Sekunden, in denen NUR der Gewinner die Shulker aufheben darf -
  # danach frei fuer alle (die normale Minecraft-Despawnzeit laeuft
  # trotzdem parallel weiter)
  schutz-sekunden: 60
