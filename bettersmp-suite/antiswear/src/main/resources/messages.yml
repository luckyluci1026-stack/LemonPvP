  wort: "Wortwahl"
  spam: "Spam"
  werbung: "Werbung"
  daten: "Persönliche Daten"

ort:
  chat: "Chat"
  privat: "Privatnachricht"
  schild: "Schild"
  buch: "Buch"
  voice-gruppe: "Voice-Gruppe"

check-usage: "%prefix%<gray>/antiswear check <Text></gray>"
check-sauber: "%prefix%<green>Kein Treffer - dieser Text würde durchgehen:</green> <white>%text%</white>"
check-treffer: "%prefix%<red>Treffer:</red> <white>%woerter%</white> <gray>(<white>%punkte%</white> Pkt.)</gray><newline><gray>Ergebnis:</gray> <white>%zensiert%</white>"
check-blockiert: "komplett blockiert"

punkte-usage: "%prefix%<gray>/antiswear punkte <Spieler></gray>"
