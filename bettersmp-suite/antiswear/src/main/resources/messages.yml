prefix: "<gradient:#6C5CE7:#00D4FF><bold>BuckSMP</bold></gradient> <dark_gray>»</dark_gray> "

reloaded: "%prefix%<green>Konfiguration und Wortliste neu geladen.</green>"

hilfe: "%prefix%<gray>/antiswear <white>reload</white> <dark_gray>|</dark_gray> <white>check <Text></white> <dark_gray>|</dark_gray> <white>punkte <Spieler></white> <dark_gray>|</dark_gray> <white>reset <Spieler></white> <dark_gray>|</dark_gray> <white>stumm <Spieler> <Dauer></white></gray>"

blockiert: "%prefix%<red>Deine Nachricht wurde blockiert.</red>"
stummgeschaltet: "%prefix%<red>Du bist stummgeschaltet.</red> <gray>Noch <white>%rest%</white>.</gray>"
