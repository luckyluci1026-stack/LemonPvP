werbung: "%prefix%<red>Werbung für andere Server oder fremde Links ist hier nicht erlaubt.</red>"
daten: "%prefix%<red>Teile keine Handynummern oder E-Mail-Adressen im Chat.</red> <gray>Das schützt dich und andere.</gray>"
schild-geaendert: "%prefix%<red>Dein Schild wurde geändert, weil der Text gegen die Regeln verstößt.</red>"
