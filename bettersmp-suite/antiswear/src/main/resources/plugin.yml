name: AntiSwear
version: ${project.version}
main: de.lemonpvp.antiswear.AntiSwear
api-version: '1.21'
authors: [SMP]
description: Chat-Moderation mit starkem Umgehungsschutz, Spam-, Werbungs- und Datenschutz-Filter, Punkte-Stufen und Voice-Chat-Moderation.
softdepend: [voicechat, LuckPerms]

commands:
  antiswear:
    description: AntiSwear-Verwaltung
    usage: "/antiswear <reload|check|punkte|reset|stumm>"
    permission: antiswear.admin
  vcrules:
    description: Regeln fuer den Voice-Chat lesen und akzeptieren
    usage: "/vcrules [akzeptieren]"
    aliases: [vcregeln, voicerules, voiceregeln]
  vcmute:
    description: Spieler im Voice-Chat stummschalten
    usage: "/vcmute <Spieler> <Dauer|perm> [Grund]"
    permission: antiswear.voice.mute
  vcunmute:
    description: Voice-Stummschaltung aufheben
    usage: "/vcunmute <Spieler>"
    permission: antiswear.voice.mute
  vcmutes:
    description: Wer ist im Voice-Chat stumm?
    usage: "/vcmutes"
    permission: antiswear.voice.mute

permissions:
  antiswear.bypass:
    description: Chat wird bei dieser Person gar nicht erst geprueft
    default: op
  antiswear.notify:
    description: Sieht im Team-Chat jeden Treffer unzensiert, inklusive Punktestand
    default: op
  antiswear.admin:
    description: /antiswear nutzen (reload, check, punkte, reset, stumm)
    default: op
  antiswear.voice.mute:
    description: /vcmute, /vcunmute und /vcmutes nutzen
    default: op
