name: BetterSMP
version: ${project.version}
main: de.lemonpvp.bettersmp.BetterSMP
api-version: '1.21'
authors: [SMP]
description: SMP-Kernplugin - Chat, NoChatReports, AntiCombatLog, Ban/Mute-System, Stats, Ränge, Nametags und Scoreboard.
softdepend: [LuckPerms, PlaceholderAPI, Essentials, Vault]

# Von Paper zur Laufzeit aus Maven Central geladen (für die Datenbank).
libraries:
  - org.xerial:sqlite-jdbc:3.46.1.3
  - org.mariadb.jdbc:mariadb-java-client:3.4.1

commands:
  bettersmp:
    description: BetterSMP-Verwaltung
    usage: "/bettersmp <status|install|update|ranks|deployconfigs|reload>"
    aliases: [bsmp]
    permission: bettersmp.admin
  settings:
    description: Öffnet das BetterSMP-Einstellungs-GUI
    usage: "/settings"
    aliases: [bsettings, smpsettings]
    permission: bettersmp.settings
  stats:
    description: Zeigt Spieler-Statistiken
    usage: "/stats [Spieler]"
    permission: bettersmp.stats
  gban:
    description: Bannt einen Spieler mit festem Grund
    usage: "/gban <Spieler> <Grund>"
    permission: bettersmp.ban
  gunban:
    description: Entbannt einen Spieler
    usage: "/gunban <Spieler>"
    permission: bettersmp.ban
  gmute:
    description: Muted einen Spieler mit festem Grund
    usage: "/gmute <Spieler> <Grund>"
    permission: bettersmp.mute
  gunmute:
    description: Entmutet einen Spieler
    usage: "/gunmute <Spieler>"
    permission: bettersmp.mute

permissions:
  bettersmp.admin:
    description: Zugriff auf /bettersmp und /settings
    default: op
    children:
      bettersmp.settings: true
  bettersmp.settings:
    description: Darf das Einstellungs-GUI öffnen und ändern
    default: op
  bettersmp.stats:
    description: Darf /stats nutzen
    default: true
  bettersmp.ban:
    description: Darf bannen/entbannen
    default: op
  bettersmp.mute:
    description: Darf muten/entmuten
    default: op
  bettersmp.ban.exempt:
    description: Kann nicht gebannt werden
    default: false
  bettersmp.mute.exempt:
    description: Kann nicht gemutet werden / umgeht Mute
    default: false
  bettersmp.chat.format:
    description: Darf Farben & MiniMessage im Chat nutzen
    default: op
  bettersmp.combat.bypass:
    description: Wird im PvP nicht als im Kampf markiert
    default: false
