# ==========================================================
#  BetterSMP - Konfiguration
#  Chat, NoChatReports, AntiCombatLog, Ban/Mute, Stats,
#  Raenge, Nametags und Scoreboard - alles in einem Plugin.
#
#  Farben: MiniMessage (<gray>, <#FFD75A>, <gradient:...>)
#  UND Legacy-Codes (&7, &#FFD75A) werden ueberall verstanden.
# ==========================================================

# Dein Server-Name. Wird ueberall als %brand% eingesetzt
# (MOTD, Scoreboard-Titel, Willkommen ...). Einmal hier aendern - fertig.
brand: "SMP"

# ----------------------------------------------------------
# Datenbank
# Wird MariaDB aktiviert, landen Stats/Bans/Mutes dort - sonst
# automatisch in einer lokalen SQLite-Datei (plugins/BetterSMP/data.db).
# ----------------------------------------------------------
database:
  # auto = MariaDB wenn unten aktiviert, sonst SQLite
  type: auto
  mariadb:
    enabled: false
    host: "127.0.0.1"
    port: 3306
    database: "bettersmp"
    user: "root"
    password: ""
    # Zusaetzliche JDBC-Parameter
    properties: "useUnicode=true&characterEncoding=utf8"

# ----------------------------------------------------------
# Chat im MiniMessage-Stil
# Platzhalter: %prefix% %suffix% %player% %displayname% %message%
# + alle PlaceholderAPI-Platzhalter (falls installiert)
# ----------------------------------------------------------
chat:
  enabled: true
  # Chat als System-Nachricht senden -> nicht ueber Chat-Reports meldbar
  no-chat-reports: true
  formats:
    default: "%prefix%<hover:show_text:'<#FFD75A>Nachricht an %player% senden'><click:suggest_command:'/msg %player% '><white>%player%</white></click></hover> <dark_gray>»</dark_gray> <message>"
  mentions:
    enabled: true
    color: "<#FFD75A>"
    sound: "minecraft:block.note_block.pling"
  clickable-links: true

# NoChatReports: enforce-secure-profile=false setzen (aktiv nach Neustart)
patch-server-properties: true

# ----------------------------------------------------------
# AntiCombatLog
# ----------------------------------------------------------
combat:
  enabled: true
  tag-seconds: 15
  punishment: KILL
  untag-opponent-on-log: true
  blocked-commands: [tpa, tpahere, tpaccept, home, homes, spawn, warp, warps, back, rtp, wild, enderchest, ec, vanish, fly]
  block-elytra: true
  actionbar: true

# ----------------------------------------------------------
# Join/Quit-Nachrichten + Willkommen
# ----------------------------------------------------------
join-quit:
  enabled: true
  join: "<dark_gray>[<green>+</green>]</dark_gray> <#FFD75A>%player%</#FFD75A> <gray>ist dem Server beigetreten.</gray>"
  quit: "<dark_gray>[<red>-</red>]</dark_gray> <#FFD75A>%player%</#FFD75A> <gray>hat den Server verlassen.</gray>"
  first-join: "<dark_gray>[<#FFD75A>★</#FFD75A>]</dark_gray> <#FFD75A>%player%</#FFD75A> <gray>ist zum <white>ersten Mal</white> hier! Willkommen!</gray>"
  first-join-title:
    enabled: true
    title: "<gradient:#FFD75A:#FFB02E>Willkommen!</gradient>"
    subtitle: "<gray>Viel Spass auf %brand%</gray>"
  motd:
    enabled: true
    delay-ticks: 15
    lines:
      - ""
      - "  <gradient:#FFD75A:#FFB02E><bold>%brand%</bold></gradient>"
      - "  <gray>Willkommen zurueck, <white>%player%</white>!</gray>"
      - "  <gray>Shop: <#FFD75A>/shop</#FFD75A>  Stats: <#FFD75A>/stats</#FFD75A></gray>"
      - ""

# ----------------------------------------------------------
# Nametags (ueber dem Kopf + Tab)
# Liest den LuckPerms-Prefix (auch Gradienten!) und zeigt ihn an;
# der Spielername bleibt weiss. Funktioniert automatisch fuer JEDE
# neue LuckPerms-Gruppe - kein Eintrag pro Rang noetig.
# Auch fuer Bedrock/Geyser-Spieler sauber sichtbar.
# ----------------------------------------------------------
nametags:
  enabled: true
  # Aktualisierungsintervall in Ticks (20 = 1s)
  update-interval: 40
  # Kollision zwischen Spielern (Anschieben) erlauben?
  collision: true

# ----------------------------------------------------------
# Scoreboard (Sidebar) - Details in scoreboard.yml
# ----------------------------------------------------------
scoreboard:
  enabled: true
  update-interval: 20

# ----------------------------------------------------------
# Ban/Mute-System - Gruende & Screens in bans.yml / mutes.yml
# ----------------------------------------------------------
punishments:
  enabled: true
  # Broadcast bei Ban/Mute
  broadcast: true

# ----------------------------------------------------------
# Statistiken
# ----------------------------------------------------------
stats:
  enabled: true
  # Spielzeit alle X Sekunden in die DB schreiben
  flush-interval-seconds: 60

# ----------------------------------------------------------
# Auto-Installer
# ----------------------------------------------------------
installer:
  enabled: true
  auto-install-on-start: true
  deploy-configs: true
  auto-restart: false
  timeout-seconds: 30
  plugins:
    EssentialsX:
      enabled: true
      source: github
      repo: EssentialsX/Essentials
      assets: ["EssentialsX-{version}.jar", "EssentialsXSpawn-{version}.jar"]
    LuckPerms:
      enabled: true
      source: luckperms
    Vault:
      enabled: true
      source: github
      repo: MilkBowl/Vault
      assets: ["Vault.jar"]
    PlaceholderAPI:
      enabled: true
      source: github
      repo: PlaceholderAPI/PlaceholderAPI
      assets: ["PlaceholderAPI-{version}.jar"]
    # TAB wird weiterhin installiert (Tablist-Header/Footer), seine
    # Nametags werden aber deaktiviert - BetterSMP macht die Nametags.
    TAB:
      enabled: true
      source: github
      repo: NEZNAMY/TAB
      assets: ["TAB.v{version}.jar"]
