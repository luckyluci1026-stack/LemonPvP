# ============================================================
#  TAB - Konfiguration (von BetterSMP vorbereitet)
#  Huebsche Tablist mit LuckPerms-Prefixen, Sortierung nach
#  Raengen, Header/Footer mit Online-Zahl, Ping und TPS.
#  Doku: https://github.com/NEZNAMY/TAB/wiki
# ============================================================

header-footer:
  enabled: true
  header:
    - "<#FFD75A>&l☀ LemonPvP SMP ☀"
    - "&7Willkommen, &f%player%&7!"
    - "&r"
  footer:
    - "&r"
    - "&7Online: <#FFD75A>%online%&7 ┃ Ping: <#FFD75A>%ping%ms&7 ┃ TPS: <#FFD75A>%tps%"
    - "&7Shop: <#FFD75A>/shop&7 ┃ RTP: <#FFD75A>/rtp"

tablist-name-formatting:
  enabled: true
  anti-override: true

scoreboard-teams:
  enabled: true
  enable-collision: true
  invisible-nametags: false
  anti-override: true
  can-see-friendly-invisibles: false
  sorting-types:
    - "GROUPS:owner,admin,mod,vip,default"
    - "PLACEHOLDER_A_TO_Z:%player%"
  case-sensitive-sorting: false

ping-spoof:
  enabled: false

bossbar:
  enabled: false

scoreboard:
  enabled: false

layout:
  enabled: false

placeholders:
  date-format: "dd.MM.yyyy"
  time-format: "HH:mm:ss"
  register-tab-expansion: true

placeholderapi-refresh-intervals:
  default-refresh-interval: 500
