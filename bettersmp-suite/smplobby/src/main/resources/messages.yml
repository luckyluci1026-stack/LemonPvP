# ==========================================================
#  Alle Texte von SMPLobby.
#
#  MiniMessage: <gradient:#A:#B>, <gray>, <bold>, <newline>.
#  Die alten &-Codes gehen auch, beides darf gemischt werden.
# ==========================================================

prefix: "<gradient:#FFD75A:#FFB02E><bold>Lobby</bold></gradient> <dark_gray>»</dark_gray> "

# --- Ankommen -------------------------------------------------
ankunft-titel: "<gradient:#FFD75A:#FFB02E><bold>LEMON</bold></gradient>"
ankunft-untertitel: "<gray>Schön, dass du da bist</gray>"
ankunft-chat: "%prefix%<gray>Willkommen in der Lobby, <white>%spieler%</white>.</gray>"
ankunft-melden: "<dark_gray>[<green>+</green>]</dark_gray> <gray>%spieler%</gray>"
abgang-melden: "<dark_gray>[<red>-</red>]</dark_gray> <gray>%spieler%</gray>"

# --- Spawn ----------------------------------------------------
spawn-gesetzt: "%prefix%<green>Spawn gesetzt.</green>"
spawn-fehlt: "%prefix%<red>Es ist noch kein Spawn gesetzt.</red><newline><gray>Stell dich hin und tipp <white>/setspawn</white>.</gray>"
spawn-da: "%prefix%<gray>Du bist am Spawn.</gray>"

# --- Server-Auswahl -------------------------------------------
waehler-verbinde: "%prefix%<gray>Verbinde dich mit <white>%server%</white> ...</gray>"
waehler-schon-da: "%prefix%<gold>Da bist du schon.</gold>"
waehler-kein-proxy: "%prefix%<red>Der Proxy antwortet nicht.</red><newline><gray>Läuft die Lobby wirklich hinter dem Proxy?</gray>"

# --- Spieler verstecken ---------------------------------------
verstecken-an: "%prefix%<gray>Die anderen sind jetzt <white>ausgeblendet</white>.</gray>"
verstecken-aus: "%prefix%<gray>Die anderen sind wieder <white>sichtbar</white>.</gray>"

# --- Regeln (das Buch in der Schnellleiste) -------------------
regeln:
  - "<gradient:#FFD75A:#FFB02E><bold>Regeln</bold></gradient>"
  - "<gray> 1. Sei freundlich.</gray>"
  - "<gray> 2. Kein Griefing, kein Klauen.</gray>"
  - "<gray> 3. Keine Cheats, keine Mods, die dir Vorteile geben.</gray>"
  - "<gray> 4. Was in der Schule gilt, gilt auch hier.</gray>"

# --- Schutz ---------------------------------------------------
nicht-bauen: "%prefix%<red>Hier wird nicht gebaut.</red>"

# --- Befehle --------------------------------------------------
nur-im-spiel: "%prefix%<red>Das geht nur im Spiel.</red>"
keine-rechte: "%prefix%<red>Dazu hast du keine Rechte.</red>"
neu-geladen: "%prefix%<green>Konfiguration neu geladen.</green>"
hilfe: "%prefix%<gray>/smplobby <white>reload</white> <dark_gray>|</dark_gray> <white>setspawn</white> <dark_gray>|</dark_gray> <white>items</white></gray>"
items-gegeben: "%prefix%<green>Gegenstände neu in die Schnellleiste gelegt.</green>"
