# FastShop - Nachrichten (MiniMessage + Legacy-Codes)
prefix: "<gradient:#F1C40F:#E67E22><bold>Shop</bold></gradient> <dark_gray>»</dark_gray> "

no-permission: "%prefix%<red>Dazu hast du keine Rechte.</red>"
players-only: "%prefix%<red>Nur für Spieler.</red>"
reloaded: "%prefix%<green>Shop neu geladen.</green>"
no-economy: "%prefix%<red>Kein Economy-System gefunden (Vault + EssentialsX nötig).</red>"

bought: "%prefix%<green>Gekauft: <white>%amount%x %item%</white> für <green>%price%</green>.</green>"
sold: "%prefix%<gold>Verkauft: <white>%amount%x %item%</white> für <gold>%price%</gold>.</gold>"
sold-multi: "%prefix%<gold>Verkauft: <white>%count%</white> Item(s) für <gold>%price%</gold>.</gold>"
not-enough-money: "%prefix%<red>Du brauchst <white>%price%</white>, hast aber nur <white>%balance%</white>.</red>"
not-enough-items: "%prefix%<red>Du hast nicht so viele <white>%item%</white>.</red>"
inventory-full: "%prefix%<red>Dein Inventar ist voll.</red>"
not-buyable: "%prefix%<red>Dieses Item kann man nicht kaufen.</red>"
not-sellable: "%prefix%<red>Dieses Item kann man nicht verkaufen.</red>"
nothing-in-hand: "%prefix%<red>Du hältst nichts in der Hand.</red>"
nothing-sold: "%prefix%<gray>Nichts aus der Verkaufsliste gefunden. Alles andere legst du ins Verkaufsfenster: <white>/sell</white></gray>"

worth: "%prefix%<gray><white>%item%</white> <dark_gray>│</dark_gray> Verkauf <gold>%sell%</gold> <dark_gray>│</dark_gray> Kauf <green>%buy%</green></gray>"
worth-none: "%prefix%<gray>Dieses Item kann man nicht verkaufen.</gray>"
worth-auto: " <dark_gray>(aus den Zutaten berechnet)</dark_gray>"

sell-gui-title: "<gradient:#F1C40F:#E67E22>Zum Verkaufen ablegen</gradient>"
sell-gui-hint: "%prefix%<gray>Lege Items hinein und schließe das Fenster zum Verkaufen.</gray>"

additem-usage: "%prefix%<gray>/fastshop additem <Kategorie> <Kaufpreis> <Verkaufspreis> <gray>(Item in der Hand)</gray></gray>"
additem-done: "%prefix%<green><white>%item%</white> zu <white>%category%</white> hinzugefügt (Kauf %buy%, Verkauf %sell%).</green>"
additem-no-category: "%prefix%<red>Kategorie <white>%category%</white> existiert nicht.</red>"

setprice-usage: "%prefix%<gray>/fastshop <setbuy|setsell> <Kategorie> <Preis> <gray>(Item in der Hand)</gray></gray>"
setprice-done: "%prefix%<green>%field% von <white>%item%</white> in <white>%category%</white> auf <white>%value%</white> gesetzt.</green>"
item-not-in-category: "%prefix%<red><white>%item%</white> ist nicht in Kategorie <white>%category%</white>.</red>"
removeitem-usage: "%prefix%<gray>/fastshop removeitem <Kategorie> <gray>(Item in der Hand)</gray></gray>"
removeitem-done: "%prefix%<green><white>%item%</white> aus <white>%category%</white> entfernt.</green>"
addcategory-usage: "%prefix%<gray>/fastshop addcategory <Id> <Slot> <Name...> <gray>(Item in der Hand = Icon)</gray></gray>"
addcategory-done: "%prefix%<green>Kategorie <white>%category%</white> angelegt.</green>"
addcategory-exists: "%prefix%<red>Kategorie <white>%category%</white> existiert bereits.</red>"
removecategory-usage: "%prefix%<gray>/fastshop removecategory <Id></gray>"
removecategory-done: "%prefix%<green>Kategorie <white>%category%</white> entfernt.</green>"
removecategory-not-found: "%prefix%<red>Kategorie <white>%category%</white> existiert nicht.</red>"

usage-sell: "%prefix%<gray>Nutzung: <white>/sell <hand|all|gui></white></gray>"
usage-fastshop: "%prefix%<gray>/fastshop <white>reload | additem | setbuy | setsell | removeitem | addcategory | removecategory</white></gray>"

# Auktionshaus (/ah)
ah-prefix: "<gradient:#2ECC71:#1ABC9C><bold>Auktionshaus</bold></gradient> <dark_gray>»</dark_gray> "
ah-title: "<dark_gray>Auktionshaus <gray>(%page%/%pages%)"
ah-title-own: "<dark_gray>Deine Angebote"
ah-title-confirm: "<dark_gray>Kauf bestätigen"
ah-title-sell: "<dark_gray>Item verkaufen"
ah-listed: "%ah%<green>Angeboten: <white>%amount%x %item%</white> für <white>%price%</white> – %hours% Stunden lang.</green>"
ah-invalid-price: "%ah%<red>Ungültiger Preis. Beispiele: <white>1500</white>, <white>2.5k</white>, <white>1m</white>.</red>"
ah-price-range: "%ah%<red>Der Preis muss zwischen <white>%min%</white> und <white>%max%</white> liegen.</red>"
ah-limit: "%ah%<red>Du hast schon <white>%max%</white> Angebote (abgelaufene zählen mit). Hol erst eins unter <white>/ah meine</white> ab.</red>"
ah-select-item: "%ah%<red>Klick erst unten in deinem Inventar auf das Item, das du verkaufen willst.</red>"
ah-changed: "%ah%<red>Das Item hat sich gerade verändert. Schau es dir noch einmal an und klick dann auf Anbieten.</red>"
ah-no-economy: "%ah%<red>Kein Economy-System gefunden (Vault + EssentialsX nötig).</red>"
ah-bought: "%ah%<green>Gekauft: <white>%amount%x %item%</white> von <white>%seller%</white> für <white>%price%</white>.</green>"
ah-sold: "%ah%<gold><white>%buyer%</white> hat <white>%amount%x %item%</white> gekauft – du bekommst <white>%price%</white>.</gold>"
ah-sold-offline: "%ah%<gold>Während du weg warst, hat <white>%buyer%</white> <white>%amount%x %item%</white> gekauft – du hast <white>%price%</white> bekommen.</gold>"
ah-gone: "%ah%<red>Dieses Angebot gibt es nicht mehr.</red>"
ah-own: "%ah%<red>Das ist dein eigenes Angebot – zurücknehmen kannst du es unter <white>/ah meine</white>.</red>"
ah-no-money: "%ah%<red>Du brauchst <white>%price%</white>, hast aber nur <white>%balance%</white>.</red>"
ah-inventory-full: "%ah%<red>Mach erst einen Platz in deinem Inventar frei.</red>"
ah-cancelled: "%ah%<gray>Zurückgenommen: <white>%amount%x %item%</white>.</gray>"
ah-expired: "%ah%<yellow>Dein Angebot <white>%amount%x %item%</white> ist abgelaufen. Hol es dir unter <white>/ah meine</white> ab.</yellow>"
ah-expired-join: "%ah%<yellow>Du hast <white>%count%</white> abgelaufene(s) Angebot(e). Hol sie dir unter <white>/ah meine</white> ab.</yellow>"

# Eingabefenster im Auktionshaus (Suche und Preis)
ah-dialog-search-title: "<gradient:#2ECC71:#1ABC9C><bold>Auktionshaus durchsuchen</bold></gradient>"
ah-dialog-search-text: "<gray>Wonach suchst du? Item oder Spielername, auf Deutsch oder Englisch – zum Beispiel <white>Diamantschwert</white>, <white>netherite</white> oder einen Namen. Leer lassen zeigt wieder alle Angebote.</gray>"
ah-dialog-search-label: "<white>Suchbegriff"
ah-dialog-search-button: "<green><bold>Suchen</bold></green>"
ah-dialog-price-title: "<gradient:#2ECC71:#1ABC9C><bold>Preis festlegen</bold></gradient>"
ah-dialog-price-text: "<gray>Wie viel soll das Item kosten? Kurz geht auch: <white>1500</white>, <white>2.5k</white>, <white>1m</white>.</gray>"
ah-dialog-price-label: "<white>Preis"
ah-dialog-price-button: "<green><bold>Übernehmen</bold></green>"
ah-dialog-cancel: "<red>Abbrechen</red>"
