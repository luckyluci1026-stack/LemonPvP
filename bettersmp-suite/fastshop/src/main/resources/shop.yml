# ==========================================================
#  FastShop - Katalog
#  Einfach Kategorien und Items ergänzen. Preise in der
#  EssentialsX-Währung. buy: -1 = nicht kaufbar, sell: -1 = nicht verkaufbar.
#  icon/name/slot pro Kategorie; pro Item optional 'name' & 'lore'.
#  Optional 'enchants': {verzauberung: stufe} - macht das Item beim Kauf
#  fertig verzaubert (Stufe darf über das Vanilla-Limit gehen). Verzauberte
#  Items lassen sich sowieso nie zurückverkaufen (ShopService#isPlain lehnt
#  jeden Stack mit Verzauberung/Namen/Schaden ab) - sell: -1 steht bei ihnen
#  trotzdem dabei, damit im Menü ehrlich "Nicht verkaufbar" steht statt ein
#  Preis, der nie zustande kommen kann.
# ==========================================================
