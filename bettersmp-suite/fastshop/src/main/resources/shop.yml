# ==========================================================
#  FastShop - Katalog
#  /shop zum Kaufen ist klein wie auf DonutSMP: End, Nether, Gear,
#  Essen. Verkaufen (/sell) geht mit jedem Item: Was hier steht, hat
#  seinen festen Preis. Alles andere bewertet FastShop selbst aus den
#  Rezepten (was die Zutaten wert sind), so kann niemand durch Craften
#  Geld vermehren. Preise in der EssentialsX-Währung.
#  buy: -1 = nicht kaufbar, sell: -1 = nie verkaufbar.
#  im-menue: false = Kategorie erscheint nicht im /shop (nur Preise).
#  icon/name/slot pro Kategorie; pro Item optional 'name' & 'lore'.
#  Alles im Shop ist unverzaubert. Steht bei einem Item noch 'enchants:',
#  entfernt FastShop das beim Start.
# ==========================================================

# Stand des Katalogs, bitte nicht ändern. Eine ältere shop.yml ohne
# diesen Stand stellt FastShop beim Start einmal auf diesen Katalog um.
