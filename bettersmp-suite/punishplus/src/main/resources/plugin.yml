name: PunishPlus
version: ${project.version}
main: de.lemonpvp.punishplus.PunishPlus
api-version: '1.21'
authors: [SMP]
description: /offend (temporaer) und /punish (immer dauerhaft) mit vorgefertigten Gruenden samt eigener Dauer aus bans.yml.

commands:
  offend:
    description: Temporaerer Bann mit vorgefertigtem Grund
    usage: "/offend <Spieler> <Grund>"
    # Absichtlich kein "permission:" hier - der Befehl prueft selbst und
    # zeigt dabei die eigene, gebrandete Nachricht statt Bukkits Standardtext.
  punish:
    description: Dauerhafter Bann mit vorgefertigtem Grund
    usage: "/punish <Spieler> <Grund>"
  punishplus:
    description: PunishPlus-Verwaltung
    usage: "/punishplus reload"
    permission: punishplus.admin

permissions:
  punishplus.offend:
    description: /offend nutzen
    default: op
  punishplus.punish:
    description: /punish nutzen
    default: op
  punishplus.exempt:
    description: Kann weder ge-offended noch ge-punished werden
    default: false
  punishplus.admin:
    description: /punishplus reload
    default: op
