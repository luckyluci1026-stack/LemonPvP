# ==========================================================
#  PunishPlus - vorgefertigte Gruende
#
#  Jeder Grund hat hier seine eigene Dauer - beim Befehl selbst wird nur
#  noch die Grund-ID getippt, keine Dauer mehr:
#    /offend <Spieler> CHEATEN
#    /punish <Spieler> CHEATEN
#
#  dauer gilt NUR fuer /offend (30m 12h 7d 2w, "perm"/"0" = dauerhaft).
#  /punish ist unabhaengig von dieser Zahl IMMER dauerhaft - der Wert
#  wird dort schlicht ignoriert, muss aber trotzdem dastehen (YAML).
#
#  Weder /offend noch /punish lassen sich per Befehl rueckgaengig machen.
#  Von Hand editieren geht, wird aber nicht automatisch neu geladen -
#  dafuer /punishplus reload.
# ==========================================================
gruende:
  CHEATEN:
    text: "Cheaten / Hacks"
    dauer: "30d"
  GRIEFING:
    text: "Griefing"
    dauer: "7d"
  BELEIDIGUNG:
    text: "Beleidigung / Toxic Chat"
    dauer: "1d"
  WERBUNG:
    text: "Werbung / Spam"
    dauer: "3d"
  SCHWERWIEGEND:
    text: "Schwerwiegender Verstoß"
    dauer: "14d"
