# PunishPlus - Nachrichten (MiniMessage)
prefix: "<gradient:#6C5CE7:#00D4FF><bold>Punish</bold></gradient> <dark_gray>»</dark_gray> "

no-permission: "%prefix%<red>Dazu hast du keine Rechte.</red>"
players-only: "%prefix%<red>Nur für Spieler.</red>"
reloaded: "%prefix%<green>Konfiguration neu geladen.</green>"
not-online: "%prefix%<red><white>%spieler%</white> ist nicht online.</red>"
exempt: "%prefix%<red><white>%spieler%</white> kann nicht belangt werden.</red>"
unknown-reason: "%prefix%<red>Unbekannter Grund <white>%grund%</white>. Verfügbar: <gray>%liste%</gray></red>"

offend:
  usage: "%prefix%<gray>/offend <Spieler> <Grund></gray>"
  success: "%prefix%<green><white>%spieler%</white> wurde geoffended <gray>(%grund%, %dauer%)</gray>.</green>"
  notice: "%prefix%<gold>Du wurdest temporär gesperrt: <white>%grund%</white> <gray>(%dauer%)</gray></gold>"
  broadcast: "<dark_gray>[<gold>⚠</gold>]</dark_gray> <#00D4FF>%spieler%</#00D4FF> <gray>wurde von <white>%ausfuehrer%</white> geoffended <dark_gray>(%grund%)</dark_gray></gray>"

punish:
  usage: "%prefix%<gray>/punish <Spieler> <Grund></gray>"
  success: "%prefix%<green><white>%spieler%</white> wurde dauerhaft gepunished <gray>(%grund%)</gray>.</green>"
  notice: "%prefix%<red>Du wurdest dauerhaft gesperrt: <white>%grund%</white></red>"
  broadcast: "<dark_gray>[<red>⛔</red>]</dark_gray> <#00D4FF>%spieler%</#00D4FF> <gray>wurde von <white>%ausfuehrer%</white> gepunished <dark_gray>(%grund%)</dark_gray></gray>"

kick:
  temp: "<gradient:#6C5CE7:#00D4FF><bold>Du bist gesperrt</bold></gradient><newline><newline><white>Grund: <gray>%grund%</gray><newline><white>Läuft ab: <gray>%bis%</gray><newline><newline><dark_gray>Das ist eine temporäre Sperre - sie läuft von selbst ab."
  perm: "<gradient:#6C5CE7:#00D4FF><bold>Du bist dauerhaft gesperrt</bold></gradient><newline><newline><white>Grund: <gray>%grund%</gray><newline><newline><dark_gray>Diese Sperre ist dauerhaft."
