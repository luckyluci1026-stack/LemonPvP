id: pvp-scoreboard
version: 1.0.0
name: LemonPvP Scoreboard
description: Live-Seitenleiste mit Kills, Toden, K/D, Serie, Rating und Rang; zeigt den Kampf-Countdown von pvp-combattag.
authors: [PaperSwap contributors]
main: dev.lemonpvp.pvp.scoreboard.ScoreboardModule
api-version: 1
minecraft-versions: ["1.21.11", "26.*"]
capabilities: [events, commands, scheduler]
permissions:
  pvp-scoreboard.use:
    description: /sb
    default: true
dependencies:
  - id: pvp-core
    version: ">=1.0.0 <2.0.0"
resources: [config.yml]
