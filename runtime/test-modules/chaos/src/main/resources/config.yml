# Deliberate faults during the module lifecycle.
#
# fail-on-load / fail-on-enable / enable-delay-ms are read by the NEXT instance, i.e. after
#   /fork module reload test-chaos  (the running version must survive: rollback)
# fail-on-disable is applied at once with /fork module config test-chaos
#
# fail-on-load:    onLoad throws -> the reload is aborted before the old version is touched
# fail-on-enable:  onEnable throws after registering a listener and /chaos -> both are
#                  released again and the old version is enabled again (rollback)
# fail-on-disable: onDisable throws -> the runtime still releases everything
# enable-delay-ms: onEnable blocks the main thread this long (0-10000); above
#                  operation-timeout-seconds in lemon-runtime.yml the runtime warns
fail-on-load: false
fail-on-enable: false
fail-on-disable: false
enable-delay-ms: 0
