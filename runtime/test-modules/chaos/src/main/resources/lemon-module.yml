id: test-chaos
version: 1.0.0
name: Lemon Chaos Test
description: Misbehaves on purpose to test the runtime's fault handling - throwing listeners, commands and tasks, failing load/enable/disable, slow enable, blocking async work, a leaked thread. Test module, not for production servers.
authors: [Lemon contributors]
main: dev.lemonpvp.test.chaos.ChaosModule
api-version: 1
minecraft-versions: ["1.21.11", "26.*"]
capabilities: [events, commands, scheduler]
permissions:
  test-chaos.use:
    description: Run /chaos
    default: op
resources: [config.yml]
