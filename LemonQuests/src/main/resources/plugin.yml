name: LemonQuests
version: "1.0.0"
main: com.lemonpvp.lemonquests.LemonQuests
api-version: "1.21"
softdepend: [LuckPerms]
commands:
  quests:
    description: Open quests menu
    permission: lemonquests.use
  gquests:
    description: Admin quest management
    permission: lemonquests.admin
  gxp:
    description: Admin XP management
    permission: lemonquests.admin.xp
  glevel:
    description: Admin level management
    permission: lemonquests.admin.level
permissions:
  lemonquests.use:
    default: true
  lemonquests.admin:
    description: All LemonQuests admin commands
    default: op
    children:
      lemonquests.admin.reload: true
      lemonquests.admin.give: true
      lemonquests.admin.complete: true
      lemonquests.admin.info: true
      lemonquests.admin.xp: true
      lemonquests.admin.level: true
  lemonquests.admin.reload:
    default: op
  lemonquests.admin.give:
    default: op
  lemonquests.admin.complete:
    default: op
  lemonquests.admin.info:
    default: op
  lemonquests.admin.xp:
    default: op
  lemonquests.admin.level:
    default: op
